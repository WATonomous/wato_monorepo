launch:
  # Launch arguments
  - arg:
      name: carla_port
      default: "2000"
      description: "CARLA server port"
  - arg:
      name: pygame_hud_enabled
      default: "true"
      description: "Enable the pygame HUD web visualizer"
  - arg:
      name: pygame_web_port
      default: "5000"
      description: "Port for the pygame HUD web server"
  - arg:
      name: scenario
      default: "carla_scenarios.scenarios.light_traffic_scenario"
      description: "Initial manual CARLA world selector"

  - arg:
      name: session_mode
      default: "false"
      description: "Idle world server controlled by a managed session"

  # Eve Robot Description
  - include:
      file: "$(find-pkg-share eve_description)/launch/tf_publish.yaml"

  # Carla Bridge
  - include:
      file: $(find-pkg-share carla_bringup)/launch/carla_bridge.launch.yaml
      arg:
        - name: config_file
          value: $(find-pkg-share simulation_bringup)/config/carla_bridge.yaml
        - name: carla_port
          value: $(var carla_port)
        - name: pygame_hud_enabled
          value: $(var pygame_hud_enabled)
        - name: pygame_web_port
          value: $(var pygame_web_port)
        - name: session_mode
          value: $(var session_mode)
        - name: scenario
          value: $(var scenario)

  # The manager owns experiment state; the scenario server owns physics.
  - node:
      if: $(var session_mode)
      pkg: simulation_manager
      exec: simulation_runner
      name: simulation_runner
      output: screen
      param:
        - name: use_sim_time
          value: false
