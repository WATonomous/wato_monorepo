launch:
  # Launch arguments
  - arg:
      name: config_file
      default: $(find-pkg-share carla_bringup)/config/carla_bridge.yaml
      description: "Path to the CARLA bridge configuration file"
  - arg:
      name: carla_port
      default: "2000"
      description: "CARLA server port"
  - arg:
      name: pygame_hud_enabled
      default: "true"
      description: "Enable the pygame HUD web visualizer"
  - arg:
      name: pygame_web_port
      default: "5000"
      description: "Port for the pygame HUD web server"

  - arg:
      name: scenario_registry
      default: $(find-pkg-share carla_scenarios)/config/scenarios.yaml
  - arg:
      name: maps_root
      default: /opt/watonomous/maps

  # Scenario Server Node
  # Note: scenario_server uses wall time since it's the /clock source
  - node:
      pkg: carla_scenarios
      exec: scenario_server
      name: scenario_server
      namespace: carla
      output: screen
      param:
        - name: use_sim_time
          value: false
        - from: $(var config_file)
        - name: carla_port
          value: $(var carla_port)
        - name: scenario_registry
          value: $(var scenario_registry)
        - name: maps_root
          value: $(var maps_root)

  # Lifecycle Manager - waits for scenario_server to connect to CARLA, then brings up all nodes
  # Note: lifecycle_manager uses wall time since it orchestrates before /clock is available
  - node:
      pkg: carla_lifecycle
      exec: lifecycle_manager
      name: carla_lifecycle_manager
      namespace: carla
      output: screen
      param:
        - name: use_sim_time
          value: false
        - name: scenario_server_name
          value: /carla/scenario_server
        - name: node_names
          value:
            - /carla/carla_localization
            - /carla/ackermann_control
            - /carla/lidar_publisher
            - /carla/bbox_publisher
            - /carla/pygame_hud
        - name: optional_node_names
          value: [/carla/pygame_hud]
        - name: service_timeout
          value: 30.0
        - name: startup_retry_interval
          value: 5.0

  # Localization Node (publishes TF: map -> odom -> base_link)
  - node:
      pkg: carla_localization
      exec: localization
      name: carla_localization
      namespace: carla
      output: screen
      param:
        - name: use_sim_time
          value: true
        - from: $(var config_file)
        - name: carla_port
          value: $(var carla_port)

  # Ackermann owns the ego commands. Teleop/autopilot must be launched
  # separately after disabling Ackermann; two actuator writers race each other.
  # Ackermann Control Node
  - node:
      pkg: carla_control
      exec: ackermann_control
      name: ackermann_control
      namespace: carla
      output: screen
      param:
        - name: use_sim_time
          value: true
        - from: $(var config_file)
        - name: carla_port
          value: $(var carla_port)

  # LiDAR Publisher Node
  - node:
      pkg: carla_perception
      exec: lidar_publisher
      name: lidar_publisher
      namespace: carla
      output: screen
      param:
        - name: use_sim_time
          value: true
        - from: $(var config_file)
        - name: carla_port
          value: $(var carla_port)

  # BBox Publisher Node
  - node:
      pkg: carla_perception
      exec: bbox_publisher
      name: bbox_publisher
      namespace: carla
      output: screen
      param:
        - name: use_sim_time
          value: true
        - from: $(var config_file)
        - name: carla_port
          value: $(var carla_port)

  # Pygame HUD Node (web-based map visualizer)
  - node:
      pkg: carla_pygame
      exec: pygame_hud
      name: pygame_hud
      namespace: carla
      output: screen
      if: $(var pygame_hud_enabled)
      param:
        - name: use_sim_time
          value: true
        - from: $(var config_file)
        - name: carla_port
          value: $(var carla_port)
        - name: web_port
          value: $(var pygame_web_port)

  # 3D Detection Visualization (converts Detection3DArray to MarkerArray)
  - node:
      pkg: vision_msgs_markers
      exec: vision_msgs_markers_node
      name: bbox_markers
      namespace: carla
      output: screen
      param:
        - name: use_sim_time
          value: true
      remap:
        - from: detections_in
          to: /carla/detections_3d
        - from: markers_out
          to: /carla/bbox_markers

  # Available before action is started; owns only injected trajectory messages.
  - node:
      pkg: carla_fake_planner
      exec: carla_fake_planner
      name: carla_fake_planner
      namespace: carla
      output: screen
      param:
        - name: use_sim_time
          value: true
        - from: $(var config_file)
        - name: carla_port
          value: $(var carla_port)
