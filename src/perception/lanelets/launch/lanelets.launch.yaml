---
launch:
  - arg:
      name: image_topic
      default: /camera_pano_nn/image_rect_compressed
  - arg:
      name: camera_info_topic
      default: /camera_pano_nn/camera_info
  - arg:
      name: cloud_topic
      default: /lidar/all/points_merged

  - node:
      pkg: lanelets
      exec: lanelets_node
      name: lanelets_node
      output: screen
      param:
        - from: $(find-pkg-share lanelets)/config/params.yaml
      remap:
        - from: input_image
          to: $(var image_topic)
        - from: input_camera_info
          to: $(var camera_info_topic)
        - from: input_cloud
          to: $(var cloud_topic)
