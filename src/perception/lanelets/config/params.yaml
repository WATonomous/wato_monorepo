lanelets_node:
  ros__parameters:
    # true: deep_msgs/MultiImageCompressed, false: deep_msgs/MultiImage.
    use_compressed_images: true

    # Same camera order and sensor dimensions as BEVFusion.
    camera_names: ["camera_pano_nn", "camera_pano_ne", "camera_pano_nw", "camera_pano_ss", "camera_pano_sw", "camera_pano_se"]
    image_width: 1280
    image_height: 1024
    max_points: 300000
    sync_queue_size: 10
    sync_max_time_diff_ms: 200.0

    # TF must provide map <- cloud.header.frame_id and map <- ego_frame at the cloud stamp.
    map_frame: map
    ego_frame: base_link

    hrnet_plan: /opt/watonomous/models/semvecnet/hrnet_ocrnet_mapillary.plan
    semvecnet_onnx: /opt/watonomous/models/semvecnet/semvecnet.onnx
