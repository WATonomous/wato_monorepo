#
# Runs camera_trigger_node as its own process (not inside perception_container),
# so a fault in it can never stop the camera drivers.
---
launch:
  - arg:
      name: "config_file"
      default: "$(find-pkg-share camera_trigger)/config/camera_trigger.yaml"
      description: "Parameter file for camera_trigger_node"

  - node:
      pkg: "camera_trigger"
      exec: "camera_trigger_node"
      name: "camera_trigger"
      output: "screen"
      param:
        - from: "$(var config_file)"
