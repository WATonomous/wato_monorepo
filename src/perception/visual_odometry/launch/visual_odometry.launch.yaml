# cuVSLAM multicamera visual odometry -> /perception/visual_odometry/odometry (nav_msgs/Odometry)
launch:
  - arg:
      name: config_file
      default: $(find-pkg-share visual_odometry)/config/nn_nw.yaml
      description: "VO camera-set config: nn_nw.yaml (default), front3.yaml or all6.yaml"
  - arg:
      name: use_sim_time
      default: "false"
      description: "true when replaying a bag with --clock"

  - node:
      pkg: visual_odometry
      exec: vo_node
      name: visual_odometry
      namespace: perception
      output: screen
      param:
        - from: $(var config_file)
        - name: use_sim_time
          value: $(var use_sim_time)
