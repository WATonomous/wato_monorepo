---
launch:
  - arg:
      name: camera_input
      default: compressed
      description: "Camera images: 'compressed' (per-camera JPEG topics, bags) or 'nitros' (per-camera GPU images, the car)"
  - arg:
      name: output_detections_topic
      default: /perception/detections_3d_bev
      description: Output 3D BEV detections topic
  - arg:
      name: output_markers_topic
      default: /perception/bev_detection_markers
      description: Output BEV detection markers topic

  - node:
      pkg: bevfusion
      exec: bevfusion_node
      name: bevfusion_node
      output: screen
      param:
        - from: $(find-pkg-share bevfusion)/config/params.yaml
        - name: camera_input
          value: $(var camera_input)
      remap:
        - from: output_detections
          to: $(var output_detections_topic)
        - from: output_markers
          to: $(var output_markers_topic)
