# Recording profile: pano_cameras_lidar_cc
# Records the 8 top (pano) cameras as JPEG, the top LiDAR (lidar_cc), Novatel GPS/IMU,
# the interfacing (CAN/OSCC/joystick) topics and TF. record_session.sh records this topic list.

bag_recorder:
  ros__parameters:
    record:
      all_topics: false
      is_discovery_disabled: false
      compression_mode: "none"
      topics:
        # Compressed rectified pano camera images
        - /camera_pano_nn/image_rect_compressed
        - /camera_pano_ne/image_rect_compressed
        - /camera_pano_ee/image_rect_compressed
        - /camera_pano_se/image_rect_compressed
        - /camera_pano_ss/image_rect_compressed
        - /camera_pano_sw/image_rect_compressed
        - /camera_pano_ww/image_rect_compressed
        - /camera_pano_nw/image_rect_compressed
        # Camera info (for calibration data)
        - /camera_pano_nn/camera_info
        - /camera_pano_ne/camera_info
        - /camera_pano_ee/camera_info
        - /camera_pano_se/camera_info
        - /camera_pano_ss/camera_info
        - /camera_pano_sw/camera_info
        - /camera_pano_ww/camera_info
        - /camera_pano_nw/camera_info
        # Top LiDAR
        - /lidar_cc/velodyne_points
        # Novatel GPS/IMU
        - /novatel/oem7/bestgnsspos
        - /novatel/oem7/bestgnssvel
        - /novatel/oem7/bestpos
        - /novatel/oem7/bestutm
        - /novatel/oem7/bestvel
        - /novatel/oem7/corrimu
        - /novatel/oem7/fix
        - /novatel/oem7/gps
        - /novatel/oem7/heading2
        - /novatel/oem7/imu/data
        - /novatel/oem7/imu/data_raw
        - /novatel/oem7/insconfig
        - /novatel/oem7/inspva
        - /novatel/oem7/inspvax
        - /novatel/oem7/insstdev
        - /novatel/oem7/odom
        - /novatel/oem7/odom_origin
        - /novatel/oem7/oem7raw
        - /novatel/oem7/ppppos
        - /novatel/oem7/rxstatus
        - /novatel/oem7/terrastarinfo
        - /novatel/oem7/terrastarstatus
        - /novatel/oem7/time
        # Interfacing (CAN, OSCC, joystick, PID): every /interfacing topic the stack publishes
        - /interfacing/ackermann
        - /interfacing/ackermann_mux/transition_event
        - /interfacing/ackermann_smoother_node/transition_event
        - /interfacing/action/ackermann
        - /interfacing/action/is_idle
        - /interfacing/can_state_estimator/body_velocity
        - /interfacing/can_state_estimator/wheel_joint_states
        - /interfacing/can_state_estimator/steering_angle
        - /interfacing/can_state_estimator_node/transition_event
        - /interfacing/dummy/ackermann
        - /interfacing/joy
        - /interfacing/joy/set_feedback
        - /interfacing/joystick/ackermann
        - /interfacing/joystick/ackermann_is_idle
        - /interfacing/joystick/roscco
        - /interfacing/joystick/roscco_is_idle
        - /interfacing/joystick/state
        - /interfacing/joystick_node/transition_event
        - /interfacing/oscc_interfacing/autonomy_state
        - /interfacing/oscc_interfacing/is_armed
        - /interfacing/oscc_interfacing/steering_angle
        - /interfacing/oscc_interfacing/steering_torque
        - /interfacing/oscc_interfacing/wheel_speeds
        - /interfacing/oscc_mux/transition_event
        - /interfacing/pid/feedforward
        - /interfacing/pid/roscco
        - /interfacing/roscco
        - /interfacing/smoothed/ackermann
        - /interfacing/steering_pid_state/pid_state
        - /interfacing/vel_driven_feedforward_pid_node/transition_event
        - /interfacing/velocity_derived
        - /interfacing/velocity_pid_state/pid_state
        # Transforms
        - /tf
        - /tf_static

    storage:
      storage_id: "mcap"
      max_bagfile_size: 21474836480  # 20 GB
      max_cache_size: 104857600  # 100 MB
