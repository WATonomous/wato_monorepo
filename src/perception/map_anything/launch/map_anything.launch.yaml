# MapAnything services -> /perception/map_anything/{estimate_relative_pose,compute_place_descriptors}
launch:
  - arg:
      name: config_file
      default: $(find-pkg-share map_anything)/config/server.yaml
      description: "map_anything server parameters"
  - arg:
      name: checkpoint
      default: "facebook/map-anything-apache"
      description: "Hugging Face checkpoint: facebook/map-anything-apache or facebook/map-anything (CC-BY-NC)"
  - arg:
      name: use_sim_time
      default: "false"
      description: "true when replaying a bag with --clock"

  - node:
      pkg: map_anything
      exec: server_node
      name: map_anything
      namespace: perception
      output: screen
      param:
        - from: $(var config_file)
        - name: checkpoint
          value: $(var checkpoint)
        - name: use_sim_time
          value: $(var use_sim_time)
