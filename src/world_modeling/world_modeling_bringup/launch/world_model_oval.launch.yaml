# world_model_oval.launch.yaml
#
# Minimal bringup that just LOADS and VISUALIZES the oval track lanelet map
# (maps/osm/oval_track_4_lane.osm, generated by tools/generate_oval_track.py). It runs:
#   - world_model : loads the oval OSM and publishes lanelet map messages
#   - map_viz_markers : republishes the map as RViz markers on lanelet/map_viz_markers
#   - lifecycle manager : configures + activates world_model
#
# The map is authored about lat/lon (0,0) like the CARLA town exports, so the
# "local_cartesian" projector loads it immediately -- no utm -> map TF (and hence no
# GPS/eidos stack) is required, and its XY metres coincide with the CARLA world.
#
# Usage (map only):
#   ros2 launch world_modeling_bringup world_model_oval.launch.yaml
#
# This is composed by fake_planner/launch/oval_track.launch.yaml, which adds the
# fake planner + pure pursuit controller on top.
---
launch:
  - arg:
      name: config_file
      default: $(find-pkg-share world_modeling_bringup)/config/world_model_oval.yaml
      description: world_model configuration file (oval map path + projector)

  - arg:
      name: autostart
      default: "true"
      description: Automatically configure and activate world_model

  # World Model -- loads the oval OSM
  - node:
      pkg: world_model
      exec: world_model_node
      name: world_model
      namespace: "world_modeling"
      output: screen
      param:
        - from: $(var config_file)
      remap:
        - from: "world_objects"
          to: "world_objects_enriched"
        - from: "lane_context"
          to: "lanelet/lane_context"
        - from: "map_visualization"
          to: "lanelet/map_visualization"
        - from: "route_ahead"
          to: "lanelet/route_ahead"
        - from: "lanelet_ahead"
          to: "lanelet/lanelet_ahead"

  # Lanelet map visualization markers
  - node:
      pkg: lanelet_markers
      exec: map_viz_markers_node
      name: map_viz_markers_node
      namespace: "world_modeling"
      output: screen
      param:
        - from: $(var config_file)
      remap:
        - from: "lane_context"
          to: "lanelet/lane_context"
        - from: "map_visualization"
          to: "lanelet/map_visualization"
        - from: "markers"
          to: "lanelet/map_viz_markers"

  # Lifecycle Manager
  - node:
      pkg: wato_lifecycle_manager
      exec: wato_lifecycle_manager_node
      name: world_model_oval_lifecycle_manager
      namespace: "world_modeling"
      output: screen
      param:
        - name: node_names
          value:
            - /world_modeling/world_model
        - name: autostart
          value: $(var autostart)
        - name: transition_timeout_s
          value: 10.0
        - name: bond_timeout_s
          value: 4.0
        - name: bond_enabled
          value: false
