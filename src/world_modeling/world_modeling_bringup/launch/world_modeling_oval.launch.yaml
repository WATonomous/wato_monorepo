# world_modeling_oval.launch.yaml -- world_modeling_sim.launch.yaml with the oval map
# (maps/osm/oval_track_4_lane.osm). Argument binding only; all nodes live in the sim launch.
#
#   Full stack (real planner under test):  ros2 launch world_modeling_bringup world_modeling_oval.launch.yaml
#     -> world_model -> behaviour -> lattice_planning -> trajectory_planner -> controller,
#        15 nodes; pair with `ros2 launch action_bringup action.launch.yaml`.
#
#   Map + markers only (fake planner):     ros2 launch world_modeling_bringup world_modeling_oval.launch.yaml map_only:=true
#     -> world_model + map markers, 3 nodes. The fake planner replaces the planning chain,
#        so the rest would be confounds rather than dependencies.
#
# eidos_map_path defaults to empty because no prior SLAM map exists for the oval.
---
launch:
  - arg:
      name: autostart
      default: "true"
      description: Automatically configure and activate managed nodes

  - arg:
      name: use_sim_time
      default: "true"
      description: Use simulation time from /clock topic

  - arg:
      name: map_only
      default: "false"
      description: Run only world_model + lanelet map markers (pairs with the fake planner)

  - arg:
      name: bond_enabled
      default: "false"
      description: Enable bond-based crash detection

  - arg:
      name: log_bt
      default: "info"
      description: Log level for behaviour_node

  - arg:
      name: eidos_map_path
      default: ""
      description: Prior SLAM map; empty skips loading (no prior eidos map exists for the oval).

  - include:
      file: $(find-pkg-share world_modeling_bringup)/launch/world_modeling_sim.launch.yaml
      arg:
        - name: config_file
          value: $(find-pkg-share world_modeling_bringup)/config/world_model_oval.yaml
        - name: eidos_map_path
          value: $(var eidos_map_path)
        - name: map_only
          value: $(var map_only)
        - name: autostart
          value: $(var autostart)
        - name: use_sim_time
          value: $(var use_sim_time)
        - name: bond_enabled
          value: $(var bond_enabled)
        - name: log_bt
          value: $(var log_bt)
