# world_modeling_oval.launch.yaml -- the FULL world_modeling stack on the oval track
# (world_modeling_sim.launch.yaml with the oval map): world_model + behaviour + costmap +
# prediction + eidos + markers, 15 nodes. Use this when the REAL planner is under test
# (world_model -> behaviour -> lattice_planning -> trajectory_planner -> controller);
# pair with `ros2 launch action_bringup action.launch.yaml`.
#
# Testing a controller with the fake planner instead? Use world_modeling_oval_map_only.launch.yaml
# -- the fake planner replaces this whole chain, so these nodes are confounds rather than
# dependencies. Note eidos_map_path defaults to empty here because no prior SLAM map exists for
# the oval.
---
launch:
  - arg:
      name: autostart
      default: "true"
      description: Automatically configure and activate managed nodes

  - arg:
      name: use_sim_time
      default: "true"
      description: Use simulation time from /clock topic

  - arg:
      name: bond_enabled
      default: "false"
      description: Enable bond-based crash detection

  - arg:
      name: log_bt
      default: "info"
      description: Log level for behaviour_node

  - arg:
      name: eidos_map_path
      default: ""
      description: Prior SLAM map; empty skips loading (no prior eidos map exists for the oval).

  - include:
      file: $(find-pkg-share world_modeling_bringup)/launch/world_modeling_sim.launch.yaml
      arg:
        - name: config_file
          value: $(find-pkg-share world_modeling_bringup)/config/world_model_oval.yaml
        - name: eidos_map_path
          value: $(var eidos_map_path)
        - name: autostart
          value: $(var autostart)
        - name: use_sim_time
          value: $(var use_sim_time)
        - name: bond_enabled
          value: $(var bond_enabled)
        - name: log_bt
          value: $(var log_bt)
