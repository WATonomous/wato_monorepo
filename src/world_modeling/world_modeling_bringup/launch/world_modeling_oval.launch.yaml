# world_modeling_oval.launch.yaml
#
# The FULL world_modeling stack (world_model + behaviour + costmap + prediction +
# markers + SLAM) running on the oval track -- i.e. world_modeling_sim.launch.yaml
# with the oval map instead of Town10HD.
#
# Use this when you want the REAL planning stack to drive the map:
#     world_model -> behaviour -> lattice_planning -> trajectory_planner -> controller
# rather than the fake_planner replaying a maneuver.
#
# The oval's lanelet2 routing graph is verified to connect all the way around the lap,
# so route_ahead / lanelet_ahead resolve and lattice_planning has centerlines to follow.
#
# Compare with world_model_oval.launch.yaml, which is the MAP-ONLY bringup (world_model
# + map markers) used by the lightweight fake_planner demo.
#
# Usage:
#   1. CARLA with the oval world:
#        CARLA_SCENARIO=carla_scenarios.scenarios.oval_track_scenario watod up
#   2. This stack:
#        ros2 launch world_modeling_bringup world_modeling_oval.launch.yaml
#   3. The action stack (lattice + trajectory_planner + pure_pursuit):
#        ros2 launch action_bringup action.launch.yaml
---
launch:
  - arg:
      name: autostart
      default: "true"
      description: Automatically configure and activate managed nodes

  - arg:
      name: use_sim_time
      default: "true"
      description: Use simulation time from /clock topic

  - arg:
      name: bond_enabled
      default: "false"
      description: Enable bond-based crash detection

  - arg:
      name: log_bt
      default: "info"
      description: Log level for behaviour_node

  - arg:
      name: eidos_map_path
      default: ""
      description: >-
        Prior SLAM map for localization; empty skips loading. Defaulted to empty here
        because the sim bringup's default is a test-track map that does not correspond
        to the oval -- there is no prior eidos map for this track.

  - include:
      file: $(find-pkg-share world_modeling_bringup)/launch/world_modeling_sim.launch.yaml
      arg:
        - name: config_file
          value: $(find-pkg-share world_modeling_bringup)/config/world_model_oval.yaml
        - name: eidos_map_path
          value: $(var eidos_map_path)
        - name: autostart
          value: $(var autostart)
        - name: use_sim_time
          value: $(var use_sim_time)
        - name: bond_enabled
          value: $(var bond_enabled)
        - name: log_bt
          value: $(var log_bt)
