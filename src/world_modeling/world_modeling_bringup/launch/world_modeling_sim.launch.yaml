#
# Full world modeling stack for simulation (CARLA / bags).
#
# Usage:
#   Full stack (oval, default):  ros2 launch world_modeling_bringup world_modeling_sim.launch.yaml
#   Full stack (Town10HD):       ros2 launch world_modeling_bringup world_modeling_sim.launch.yaml map:=town
#   Map + markers only:          ros2 launch world_modeling_bringup world_modeling_sim.launch.yaml map_only:=true
#

# map_only:=true runs just world_model + the lanelet map markers (3 nodes instead of 15) --
# lane geometry with no planning chain, for when something else is producing the trajectory
# or you only want to look at the map. Nothing here depends on what that something else is.
---
launch:
  - arg:
      name: map
      default: "oval"
      description: >-
        Map to load; selects config/world_model_<map>.yaml.
        "oval" (default) = the generated 4-lane oval track, "town" = Town10HD.

  - arg:
      name: config_file
      default: $(find-pkg-share world_modeling_bringup)/config/world_model_$(var map).yaml
      description: Path to the world_model configuration file (overrides map:=)

  - arg:
      name: eidos_config_file
      default: $(find-pkg-share world_modeling_bringup)/config/eidos_slam.yaml
      description: Path to the eidos SLAM configuration file

  - arg:
      name: eidos_map_path
      default: "/opt/watonomous/maps/test_track_map/eidos_map/wrestrc.map"
      description: Path to the .map file for localization. Empty string skips loading.

  - arg:
      name: use_sim_time
      default: "true"
      description: Use simulation time from /clock topic

  - arg:
      name: map_only
      default: "false"
      description: Run only world_model + lanelet map markers (pairs with the fake planner)

  - arg:
      name: autostart
      default: "true"
      description: Automatically configure and activate managed nodes

  - arg:
      name: bond_enabled
      default: "false"
      description: Enable bond-based crash detection

  - arg:
      name: log_bt
      default: "info"
      description: Log level for behaviour_node

  # Prediction - generates trajectory hypotheses for tracked objects
  - node:
      unless: "$(var map_only)"
      pkg: prediction
      exec: prediction_node
      name: prediction_node
      namespace: "world_modeling"
      output: screen
      param:
        - from: $(find-pkg-share prediction)/config/params.yaml
        - name: use_sim_time
          value: $(var use_sim_time)
      remap:
        - from: tracks_3d
          to: /carla/tracked_detections_3d
        - from: ego_pose
          to: /localization/pose
        - from: lanelet_ahead
          to: lanelet/lanelet_ahead

  # World Model -- loads the lanelet map (kept in map_only)
  - node:
      pkg: world_model
      exec: world_model_node
      name: world_model
      namespace: "world_modeling"
      output: screen
      param:
        - from: $(var config_file)
        - name: use_sim_time
          value: $(var use_sim_time)
      remap:
        - from: "world_objects"
          to: "world_objects_enriched"
        - from: "lane_context"
          to: "lanelet/lane_context"
        - from: "map_visualization"
          to: "lanelet/map_visualization"
        - from: "route_ahead"
          to: "lanelet/route_ahead"
        - from: "lanelet_ahead"
          to: "lanelet/lanelet_ahead"

  # Lanelet Visualization Markers -- map geometry (kept in map_only)
  - node:
      pkg: lanelet_markers
      exec: map_viz_markers_node
      name: map_viz_markers_node
      namespace: "world_modeling"
      output: screen
      param:
        - from: $(var config_file)
        - name: use_sim_time
          value: $(var use_sim_time)
      remap:
        - from: "lane_context"
          to: "lanelet/lane_context"
        - from: "map_visualization"
          to: "lanelet/map_visualization"
        - from: "markers"
          to: "lanelet/map_viz_markers"

  - node:
      unless: "$(var map_only)"
      pkg: lanelet_markers
      exec: lane_context_markers_node
      name: lane_context_markers_node
      namespace: "world_modeling"
      output: screen
      param:
        - from: $(var config_file)
        - name: use_sim_time
          value: $(var use_sim_time)
      remap:
        - from: "lane_context"
          to: "lanelet/lane_context"
        - from: "markers"
          to: "lanelet/lane_context_markers"

  - node:
      unless: "$(var map_only)"
      pkg: lanelet_markers
      exec: route_ahead_markers_node
      name: route_ahead_markers_node
      namespace: "world_modeling"
      output: screen
      param:
        - from: $(var config_file)
        - name: use_sim_time
          value: $(var use_sim_time)
      remap:
        - from: "route_ahead"
          to: "lanelet/route_ahead"
        - from: "markers"
          to: "lanelet/route_ahead_markers"

  - node:
      unless: "$(var map_only)"
      pkg: lanelet_markers
      exec: area_occupancy_markers_node
      name: area_occupancy_markers_node
      namespace: "world_modeling"
      output: screen
      param:
        - from: $(var config_file)
        - name: use_sim_time
          value: $(var use_sim_time)
      remap:
        - from: "area_occupancy"
          to: "area_occupancy"
        - from: "markers"
          to: "area_occupancy_markers"

  - node:
      unless: "$(var map_only)"
      pkg: lanelet_markers
      exec: lanelet_ahead_markers_node
      name: lanelet_ahead_markers_node
      namespace: "world_modeling"
      output: screen
      param:
        - from: $(var config_file)
        - name: use_sim_time
          value: $(var use_sim_time)
      remap:
        - from: "lanelet_ahead"
          to: "lanelet/lanelet_ahead"
        - from: "markers"
          to: "lanelet/lanelet_ahead_markers"

  # World Model Visualization Markers
  # Pre-enrichment: subscribes to world_object_seeds (from prediction)
  - node:
      unless: "$(var map_only)"
      pkg: world_model_markers
      exec: world_objects_markers_node
      name: world_objects_markers_seed_node
      namespace: "world_modeling"
      output: screen
      param:
        - from: $(var config_file)
        - name: use_sim_time
          value: $(var use_sim_time)
      remap:
        - from: "world_objects"
          to: "world_object_seeds"
        - from: "markers"
          to: "world_object_seeds_markers"

  # Post-enrichment: subscribes to world_objects (from world model)
  - node:
      unless: "$(var map_only)"
      pkg: world_model_markers
      exec: world_objects_markers_node
      name: world_objects_markers_node
      namespace: "world_modeling"
      output: screen
      param:
        - from: $(var config_file)
        - name: use_sim_time
          value: $(var use_sim_time)
      remap:
        - from: "world_objects"
          to: "world_objects_enriched"
        - from: "markers"
          to: "world_objects_enriched_markers"

  # Costmap Node
  - node:
      unless: "$(var map_only)"
      pkg: costmap
      exec: costmap_node
      name: costmap_node
      namespace: "world_modeling"
      output: screen
      param:
        - from: $(var config_file)
        - name: use_sim_time
          value: $(var use_sim_time)
      remap:
        - from: world_objects
          to: world_objects_enriched
        - from: costmap
          to: costmap
        - from: pointcloud
          to: /perception/non_ground_cloud
        - from: footprint
          to: costmap_footprint
        - from: spawn_wall
          to: spawn_wall
        - from: despawn_wall
          to: despawn_wall

  # Costmap Footprint Markers
  - node:
      unless: "$(var map_only)"
      pkg: costmap_markers
      exec: costmap_markers_node
      name: costmap_markers_node
      namespace: "world_modeling"
      output: screen
      param:
        - from: $(var config_file)
        - name: use_sim_time
          value: $(var use_sim_time)
      remap:
        - from: footprint
          to: costmap_footprint
        - from: markers
          to: costmap_footprint_markers

  # Behaviour Node
  - node:
      unless: "$(var map_only)"
      pkg: behaviour
      exec: behaviour_node
      name: behaviour_node
      namespace: "world_modeling"
      output: screen
      param:
        - from: $(find-pkg-share behaviour)/config/params.yaml
        - name: use_sim_time
          value: $(var use_sim_time)
      ros_args: "--log-level world_modeling.behaviour_node:=$(var log_bt)"
      remap:
        - from: execute_behaviour
          to: /behaviour/execute_behaviour
          # reset behaviour tree service
        - from: reset_bt
          to: reset_bt
        - from: clear_walls
          to: clear_walls
        - from: speed_behaviour
          to: /behaviour/speed_behaviour
        - from: route_ahead
          to: lanelet/route_ahead
        - from: lanelet_ahead
          to: lanelet/lanelet_ahead
        - from: lane_context
          to: lanelet/lane_context
        - from: world_objects
          to: world_objects
        - from: area_occupancy
          to: area_occupancy
        - from: goal_point
          to: /goal_point
        - from: ego/odom
          to: /world_modeling/slam/odometry
        - from: ego/odom_incremental
          to: /world_modeling/liso/odometry_incremental

  # Behaviour Tree visualization markers
  - node:
      unless: "$(var map_only)"
      pkg: behaviour_markers
      exec: behaviour_markers_node
      name: behaviour_markers_node
      namespace: "world_modeling"
      output: screen
      param:
        - from: $(find-pkg-share behaviour_markers)/config/behaviour_markers.yaml
        - name: use_sim_time
          value: $(var use_sim_time)
      remap:
        - from: execute_behaviour
          to: /behaviour/execute_behaviour
        - from: speed_behaviour
          to: /behaviour/speed_behaviour
        - from: route_ahead
          to: lanelet/route_ahead
        - from: lanelet_ahead
          to: lanelet/lanelet_ahead
        - from: lane_context
          to: lanelet/lane_context
        - from: markers
          to: behaviour_markers

  # Eidos SLAM Node
  - node:
      unless: "$(var map_only)"
      pkg: eidos
      exec: eidos_node
      name: eidos_node
      namespace: "world_modeling"
      output: screen
      param:
        - from: $(var eidos_config_file)
        - name: use_sim_time
          value: $(var use_sim_time)
        # NOTE: eidos_map_path is declared and forwarded by callers but never applied here
        # (the base world_modeling.launch.yaml binds it to map.load_path). Wiring it in would
        # make the default sim run load the test-track map, so it is left disconnected until
        # the intended sim behaviour is decided.

  # Lifecycle Manager -- full stack
  - node:
      unless: "$(var map_only)"
      pkg: wato_lifecycle_manager
      exec: wato_lifecycle_manager_node
      name: world_modeling_lifecycle_manager
      namespace: "world_modeling"
      output: screen
      param:
        - name: node_names
          value:
            - /world_modeling/prediction_node
            - /world_modeling/world_model
            - /world_modeling/costmap_node
            - /world_modeling/eidos_node
        - name: autostart
          value: $(var autostart)
        - name: use_sim_time
          value: $(var use_sim_time)
        - name: transition_timeout_s
          value: 10.0
        - name: bond_timeout_s
          value: 4.0
        - name: bond_enabled
          value: $(var bond_enabled)

  # Lifecycle Manager -- map_only (world_model is the only managed node left)
  - node:
      if: "$(var map_only)"
      pkg: wato_lifecycle_manager
      exec: wato_lifecycle_manager_node
      name: world_modeling_lifecycle_manager
      namespace: "world_modeling"
      output: screen
      param:
        - name: node_names
          value:
            - /world_modeling/world_model
        - name: autostart
          value: $(var autostart)
        - name: use_sim_time
          value: $(var use_sim_time)
        - name: transition_timeout_s
          value: 10.0
        - name: bond_timeout_s
          value: 4.0
        - name: bond_enabled
          value: $(var bond_enabled)
