# Boreas LiDAR-inertial localization against a previously saved Boreas map.
---
/**/eidos_node:
  ros__parameters:
    # TF frame names
    frames:
      base_link: "boreas_base"       # Robot body frame
      odometry: "odom"               # Odometry frame
      map: "map"                     # Global map frame

    # Main SLAM loop frequency (Hz)
    slam_rate: 10.0
    # Seconds to wait for relocalization before falling back to identity pose
    relocalization_timeout: 180.0

    # ISAM2 incremental optimizer settings
    isam2:
      update_iterations: 2           # ISAM2 iterations per normal optimization step
      correction_iterations: 5       # Extra iterations when a correction factor (GPS) is added
      loop_closure_iterations: 5     # Extra iterations when loop closure is detected
      relinearize_threshold: 0.01    # Variable relinearization threshold
      relinearize_skip: 1            # Steps between relinearization checks

    # Prior factor covariance on the first state (anchors the graph origin)
    # [x, y, z, roll, pitch, yaw] diagonal variances
    prior:
      pose_cov: [1.0e-2, 1.0e-2, 1.0e-2, 1.0e-2, 1.0e-2, 1.0e-2]

    # Map persistence paths
    map:
      load_path: "/opt/watonomous/maps/boreas-2021-04-08-12-44.map"  # Prior map
      save_path: ""  # No automatic map output in localization mode

    # Published topics, services, and odometry covariance
    topics:
      pose: "slam/pose"                    # PoseStamped in map frame (consumed by eidos_transform)
      status: "slam/status"                # SlamStatus message (state, keyframe count, etc.)
      odom: "slam/odometry"                # Odometry in map frame with covariance
      odom_pose_cov: [1.0e-3, 1.0e-3, 1.0e-3, 1.0e-4, 1.0e-4, 1.0e-4]  # Diagonal pose covariance on odom topic [x,y,z,roll,pitch,yaw]
      save_map_service: "slam/save_map"    # Service to save the map to disk
      load_map_service: "slam/load_map"    # Service to load a map from disk

    # Restore the GNSS reference from the saved map without modifying that map.
    # Plugin lists (loaded in order)
    factor_plugins:
      - "gps_factor"
      - "liso_factor"

    relocalization_plugins:
      - "bnb_voxel_relocalization"

    visualization_plugins:
      - "keyframe_map_visualization"

    # Restore the GNSS-to-map transform saved during mapping; keep the prior map fixed.
    gps_factor:
      plugin: "eidos::GpsFactor"
      gps_topic: "/boreas/gnss/postprocessed/fix"
      imu_topic: "/boreas/imu/data_utm"
      imu_frame: "boreas_imu_raw"
      add_factors: false
      max_cov: 5.0
      use_elevation: true
      min_radius: 5.0
      gps_cov: [0.25, 0.25, 1.0]   # Variance floors [east, north, up], m^2

    # LISO Factor (LiDAR-Inertial Submap Odometry)
    # GICP scan-to-submap matching, produces BetweenFactor<Pose3>
    liso_factor:
      plugin: "eidos::LisoFactor"
      add_factors: false                                   # Odometry only; keep the prior map fixed
      submap_source: "prior_map"                           # Match against saved map clouds
      lidar_topic: "/boreas/lidar/points"                   # PointCloud2 input
      odom_topic: "liso/odometry"                          # Published map-frame odometry
      odometry_incremental_topic: "liso/odometry_incremental"  # Published odom-frame incremental odometry
      imu_topic: "/boreas/imu/data"                        # IMU for gyro initial guess
      lidar_frame: "boreas_lidar"                          # LiDAR TF frame
      imu_frame: "boreas_imu_raw"                          # IMU TF frame
      # INS orientation is available from the first raw IMU sample; retain stationary warmup.
      initialization:
        warmup_samples: 200                                # IMU samples before LISO starts
        stationary_gyr_threshold: 0.02                      # 0.005 never warms up before first scan; 0.02 does (rad/s)
      scan_ds_resolution: 0.5                              # Voxel downsample for incoming scans (m)
      submap_ds_resolution: 0.5                            # Voxel downsample for submap (m)
      num_neighbors: 10                                    # KNN for GICP covariance estimation
      submap_radius: 30.0                                  # Radius for keyframe collection into submap (m)
      max_submap_states: 15                                # Max keyframes in the submap
      max_correspondence_distance: 2.0                     # GICP max correspondence distance (m)
      max_iterations: 20                                   # GICP max iterations
      num_threads: 16                                      # Threads for GICP
      min_inliers: 50                                      # Min inlier correspondences for a valid match
      min_noise: 0.01                                      # Min noise floor for BetweenFactor covariance
      min_scan_distance: 5.0                               # Min travel distance between keyframes (m)
      odom_pose_cov: [0.01, 0.01, 0.005, 1.0e-6, 1.0e-6, 1.0e-3]         # Pose covariance on published odometry
      odom_twist_cov: [1.0e-4, 1.0e-4, 1.0e-8, 1.0e-10, 1.0e-10, 1.0e-6]  # Twist covariance on published odometry

    # GPS-free global relocalization; the Boreas IMU does not observe yaw.
    bnb_voxel_relocalization:
      plugin: "eidos::BnbVoxelRelocalization"
      lidar_topic: "/boreas/lidar/points"
      imu_topic: "/boreas/imu/data"
      lidar_frame: "boreas_lidar"
      imu_frame: "boreas_imu_raw"
      pointcloud_from: "liso_factor/cloud"
      min_voxel_size: 1.0
      num_levels: 4
      score_mode: "distance_field"
      df_sigma: 1.0
      df_truncation_voxels: 2
      max_score_voxels: 40000000
      min_height: 0.6
      max_height: 6.0
      max_voxels_per_level: 8000000
      max_query_range: 40.0
      target_query_points: 400
      rp_search_range: 0.02
      rp_search_steps: 1
      prefer_downsampled_source: false
      root_prefilter_points: 128
      root_prefilter_keep: 256
      search_corridor: 30.0
      z_margin: 5.0
      max_search_nodes: 200000
      prune_slack: 0.8
      nms_radius: 5.0
      min_match_score: 0.45
      min_score_ratio: 1.20
      num_gicp_candidates: 5
      min_inlier_ratio: 0.30
      scan_ds_resolution: 0.5
      submap_radius: 40.0
      submap_leaf_size: 0.4
      max_correspondence_distance: 2.0
      max_icp_iterations: 100
      num_threads: 16
      num_neighbors: 10
      search_task_multiplier: 4
      use_imu_heading: false
      imu_heading_tolerance_deg: 10.0
      use_heading_prior: false
      heading_tolerance_deg: 30.0
      allow_reverse_heading: false
      prefilter_yaw_step_deg: 10.0
      prefilter_xy_step: 2.0
      prefilter_z_step: 4.0
      prefilter_fine: true
      use_trajectory_reanchor: true
      reanchor_search_radius: 250.0
      reanchor_max_nodes: 40000
      reanchor_min_gap: 0.5
      reanchor_warn_distance: 25.0
      reanchor_max_speed_mps: 30.0
      publish_debug_grid: true
      debug_grid_topic: "slam/visualization/reloc_voxel_grid"
      use_free_space: false
      free_rays_per_keyframe: 2000
      free_max_range: 40.0
      free_end_margin: 1.0
      free_clear_near_occupied: true
      max_free_voxels: 20000000
      free_ray_origin_height: 2.0
      hit_weight: 3

    # Keyframe Map Visualization
    # Publishes accumulated/windowed keyframe cloud for RViz
    keyframe_map_visualization:
      plugin: "eidos::KeyframeMapVisualization"
      topic: "slam/visualization/map"          # Published PointCloud2 topic
      pointcloud_from: "liso_factor/cloud"     # Source for keyframe clouds
      voxel_leaf_size: 0.4                     # Downsample leaf size (m)
      publish_rate: 1.0                        # Publish rate (Hz)
      mode: "accumulate"                       # "accumulate" or "windowed"
      accumulate:
        skip_factor: 1                         # Include every Nth keyframe
      windowed:
        radius: 50.0                           # Spatial radius for windowed mode (m)

# eidos_transform config for localization mode (dual-EKF)
/**/eidos_transform_node:
  ros__parameters:
    tick_rate: 200.0
    history_window: 5.0
    frames:
      odom: "odom"
      base_link: "boreas_base"
      map: "map"
      utm: "utm"
    topics:
      odom: "transform/odometry"
      utm_to_map: "gps_factor/utm_to_map_tf"
      predict_service: "transform/predict_relative"
    ekf:
      plugin: "eidos_transform::HolonomicEKF"
      name: "holonomic_ekf"
    # [pose(6), velocity(6), accel_bias(3)]
    holonomic_ekf:
      process_noise:
        [1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4,
         1.0e-2, 1.0e-2, 1.0e-2, 1.0e-2, 1.0e-2, 1.0e-2,
         1.0e-6, 1.0e-6, 1.0e-6]
    holonomic_ekf_global:
      process_noise:
        [1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3,
         1.0e-1, 1.0e-1, 1.0e-1, 1.0e-1, 1.0e-1, 1.0e-1,
         1.0e-6, 1.0e-6, 1.0e-6]
    odom_sources:
      - "liso_odom"
      - "imu_raw"
    liso_odom:
      type: "odom"
      topic: "liso/odometry_incremental"
      pose_mask: [true, true, true, true, true, true]
      twist_mask: [true, true, true, true, true, true]
      pose_noise: [1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3]
      # [ang_x, ang_y, ang_z, lin_x, lin_y, lin_z]
      twist_noise: [5.0e-2, 5.0e-2, 5.0e-2, 1.0e-1, 3.0e-2, 3.0e-2]
    imu_raw:
      type: "imu"
      topic: "/boreas/imu/data"
      imu_frame: "boreas_imu_raw"
      # INS orientation is in Boreas ENU; the EKF state is map/odom-relative.
      # No ENU-to-map orientation conversion exists here, so fuse angular velocity only.
      use_orientation: false
      use_angular_velocity: true
      # Avoid integrating gravity error and accelerometer bias during playback.
      use_linear_acceleration: false
      gravity: 9.80511
      gravity_compensated: false
      orientation_noise: [1.0e-2, 1.0e-2, 1.0e-2, 1.0, 1.0, 1.0]
      angular_velocity_noise: [1.0e-3, 1.0e-3, 1.0e-3, 1.0, 1.0, 1.0]
      linear_velocity_noise: [1.0, 1.0, 1.0, 1.0e-1, 1.0e-1, 1.0e-1]
    map_sources:
      - "liso_map"
    liso_map:
      type: "odom"
      topic: "liso/odometry"
      pose_mask: [true, true, true, true, true, true]
      twist_mask: [false, false, false, false, false, false]
      pose_noise: [1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3]
      twist_noise: [1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3]
