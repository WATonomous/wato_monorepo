/**/world_model:
  ros__parameters:
    osm_map_path: "/opt/watonomous/maps/osm/Town10HD.osm"

    # Projection:
    # - 'local_cartesian' for CARLA-synthesized OSM maps
    # - 'utm' for geographically referenced OSM maps
    projector_type: "local_cartesian"

    # Alignment:
    # - 'fixed' when projected coordinates already use the map frame
    # - 'tf' to apply projected_frame -> map before loading the map
    alignment_mode: "fixed"

    # Geographic origin used by the projector. In fixed mode, it becomes the
    # map origin and must match the CARLA OSM coordinate convention.
    origin_lat: 0.0
    origin_lon: 0.0
    origin_alt: 0.0
