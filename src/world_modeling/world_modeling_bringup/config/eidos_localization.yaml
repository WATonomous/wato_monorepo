/**/eidos_node:
  ros__parameters:
    frames:
      base_link: "base_footprint"
      odometry: "odom"
      map: "map"

    # Main SLAM loop frequency (Hz)
    slam_rate: 10.0
    # Seconds to wait for relocalization before falling back to identity
    relocalization_timeout: 30.0

    isam2:
      relinearize_threshold: 0.01
      relinearize_skip: 1

    # Prior factor on the first state (anchors the graph origin)
    # [x, y, z, roll, pitch, yaw] covariance diagonal
    prior:
      pose_cov: [1.0e-2, 1.0e-2, 1.0e-2, 1.0e-2, 1.0e-2, 1.0e-2]

    map:
      load_path: "/opt/watonomous/maps/wrestrc.map"   # Prior map for localization
      save_path: ""

    # Published topics and services
    topics:
      pose: "slam/pose"
      status: "slam/status"
      odom: "slam/odometry"
      odom_pose_cov: [1.0e-3, 1.0e-3, 1.0e-3, 1.0e-4, 1.0e-4, 1.0e-4]  # Diagonal pose covariance on odom topic [x,y,z,roll,pitch,yaw]
      save_map_service: "slam/save_map"
      load_map_service: "slam/load_map"

    # Plugin lists
    factor_plugins:
      - "gps_factor"
      - "liso_factor"
      - "wheel_odom_factor"

    relocalization_plugins:
      - "gps_icp_relocalization"

    visualization_plugins:
      - "keyframe_map_visualization"

    # GPS Factor (loads utm_to_map offset from prior map, no factors injected)
    gps_factor:
      plugin: "eidos::GpsFactor"
      add_factors: false

      gps_topic: "/novatel/oem7/fix"
      imu_topic: "/novatel/oem7/imu/data"

      max_cov: 5.0
      use_elevation: true
      min_radius: 200.0
      pose_cov_threshold: 1.0
      gps_cov: [2.0, 2.0, 4.0]

    # LISO Factor (scan-to-submap matching against prior map)
    liso_factor:
      plugin: "eidos::LisoFactor"
      add_factors: false
      submap_source: "prior_map"

      lidar_topic: "/lidar_cc/velodyne_points"
      odom_topic: "liso/odometry"
      odometry_incremental_topic: "liso/odometry_incremental"
      imu_topic: "/novatel/oem7/imu/data"

      lidar_frame: "lidar_cc"
      imu_frame: "imu_link"

      initialization:
        warmup_samples: 200
        stationary_gyr_threshold: 0.005

      scan_ds_resolution: 0.5
      submap_ds_resolution: 0.5
      num_neighbors: 10
      submap_radius: 30.0
      max_submap_states: 5

      max_correspondence_distance: 2.0
      max_iterations: 20
      num_threads: 4

      min_inliers: 50
      min_noise: 0.01
      min_scan_distance: 5.0

      odom_pose_cov: [0.01, 0.01, 0.005, 1.0e-6, 1.0e-6, 1.0e-3]
      odom_twist_cov: [1.0e-4, 1.0e-4, 1.0e-8, 1.0e-10, 1.0e-10, 1.0e-6]

    # Wheel Odom Factor (rear wheel speed + IMU yaw rate)
    # Publishes wheel odometry for eidos_transform; graph factors off until validated
    wheel_odom_factor:
      plugin: "eidos::WheelOdomFactor"
      add_factors: false                        # No graph factors — odom output only
      joint_states_topic: "/interfacing/can_state_estimator/wheel_joint_states"
      left_joint: "rear_left_joint"
      right_joint: "rear_right_joint"
      wheel_radius: 0.31235                     # Effective rolling radius (m), tune for tire scale error
      axle_frame: "rear_axle"                   # Lever arm source (rear axle -> base_footprint)
      imu_topic: "/novatel/oem7/imu/data"       # Yaw rate source
      imu_frame: "imu_link"
      odom_topic: "wheel_odom/odometry"
      max_dt: 0.5                               # Skip integration gaps longer than this (s)
      speed_std_moving: 0.05                    # Forward speed std-dev when wheels report motion (m/s)
      zero_speed_std: 0.4                       # Forward speed std-dev when wheels read 0 (ABS cutoff) (m/s)
      lateral_std: 0.05                         # Nonholonomic lateral std-dev (m/s)
      vertical_std: 0.05                        # Vertical std-dev (m/s)
      yaw_rate_std: 0.01                        # Yaw rate std-dev (rad/s)
      factor:
        trans_std_per_meter: 0.02               # BetweenFactor translation std-dev growth (m/m)
        yaw_std_per_rad: 0.05                   # BetweenFactor yaw std-dev growth (rad/rad)
        min_std: 0.01                           # Floor on constrained std-devs
        loose_std: 10.0                         # z / roll / pitch std-dev (unconstrained)

    # GPS + ICP Relocalization
    gps_icp_relocalization:
      plugin: "eidos::GpsIcpRelocalization"

      gps_topic: "/novatel/oem7/fix"
      lidar_topic: "/lidar_cc/velodyne_points"
      imu_topic: "/novatel/oem7/imu/data"

      lidar_frame: "lidar_cc"
      imu_frame: "imu_link"

      gps_candidate_radius: 30.0
      pointcloud_from: "liso_factor/cloud"
      gps_from: "gps_factor"

      scan_ds_resolution: 0.5
      submap_leaf_size: 0.4
      max_correspondence_distance: 2.0
      max_icp_iterations: 100
      num_threads: 16
      num_neighbors: 10

      fitness_threshold: 0.3

    # Keyframe Map Visualization
    keyframe_map_visualization:
      plugin: "eidos::KeyframeMapVisualization"
      topic: "slam/visualization/map"
      pointcloud_from: "liso_factor/cloud"
      voxel_leaf_size: 0.4
      publish_rate: 1.0
      mode: "accumulate"

      accumulate:
        skip_factor: 5

      windowed:
        radius: 50.0

/**/eidos_transform_node:
  ros__parameters:
    tick_rate: 200.0

    frames:
      odom: "odom"
      base_link: "base_footprint"
      map: "map"
      utm: "utm"

    topics:
      odom: "transform/odometry"
      utm_to_map: "gps_factor/utm_to_map_tf"
      predict_service: "transform/predict_relative"

    ekf:
      plugin: "eidos_transform::HolonomicEKF"
      name: "holonomic_ekf"

    holonomic_ekf:
      process_noise:
        [1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4,
         1.0e-2, 1.0e-2, 1.0e-2, 1.0e-2, 1.0e-2, 1.0e-2,
         1.0e-6, 1.0e-6, 1.0e-6]

    holonomic_ekf_global:
      process_noise:
        [1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3,
         1.0e-1, 1.0e-1, 1.0e-1, 1.0e-1, 1.0e-1, 1.0e-1,
         1.0e-6, 1.0e-6, 1.0e-6]

    # Odom sources (local EKF only, odom frame)
    odom_sources:
      - "liso_odom"
      - "imu_raw"
      - "wheel_odom"

    liso_odom:
      type: "odom"
      topic: "liso/odometry_incremental"
      pose_mask: [true, true, true, true, true, true]
      twist_mask: [true, true, true, true, true, true]
      pose_noise: [1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3]
      # [ang_x, ang_y, ang_z, lin_x, lin_y, lin_z]
      twist_noise: [5.0e-2, 5.0e-2, 5.0e-2, 3.0e-2, 1.0e-2, 1.0e-2]

    imu_raw:
      type: "imu"
      topic: "/novatel/oem7/imu/data"
      imu_frame: "imu_link"
      use_orientation: true
      use_angular_velocity: true
      use_linear_acceleration: true
      gravity: 9.80511
      gravity_compensated: false
      orientation_noise: [1.0e-2, 1.0e-2, 1.0e-2, 1.0, 1.0, 1.0]
      angular_velocity_noise: [1.0e-3, 1.0e-3, 1.0e-3, 1.0, 1.0, 1.0]
      linear_velocity_noise: [1.0, 1.0, 1.0, 1.0e-1, 1.0, 1.0]

    # Wheel odometry: forward speed + nonholonomic lateral/vertical, per-reading covariance
    wheel_odom:
      type: "odom"
      topic: "wheel_odom/odometry"
      pose_mask: [false, false, false, false, false, false]
      # [ang_x, ang_y, ang_z, lin_x, lin_y, lin_z]
      twist_mask: [false, false, false, true, true, true]
      use_msg_covariance: true
      twist_noise: [1.0, 1.0, 1.0, 5.0e-2, 5.0e-2, 5.0e-2]  # Fallback only

    # Map sources (global EKF only, map frame)
    map_sources:
      - "liso_map"

    liso_map:
      type: "odom"
      topic: "liso/odometry"
      pose_mask: [true, true, true, true, true, true]
      twist_mask: [false, false, false, false, false, false]
      pose_noise: [1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3]
      twist_noise: [1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3]
