[project]
name = "wato-mtr-eval"
version = "0.1.0"
description = "Prediction quality harness for prediction_ml"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6.0"]

[project.optional-dependencies]
# Installed in the ROS 2 Humble environment. Never alongside 'model'.
ros = ["protobuf>=3.20"]
# Installed in the MTR/PyTorch environment. Never alongside 'ros'.
model = [
  "torch>=2.0",
  "protobuf>=3.20",
  "onnx>=1.17",
  "onnxruntime>=1.20",
]
# Waymo publishes platform-specific wheels; install this extra in the Linux
# environment used to parse and preprocess the validation shard.
waymo = ["waymo-open-dataset-tf-2-12-0"]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wato_mtr_eval*"]
