/**/eidos_node:
  ros__parameters:
    # TF frame names
    frames:
      base_link: "base_footprint"    # Robot body frame
      odometry: "odom"               # Odometry frame
      map: "map"                     # Global map frame

    # Main SLAM loop frequency (Hz)
    slam_rate: 10.0
    # Seconds to wait for relocalization before falling back to identity pose
    relocalization_timeout: 180.0

    isam2:
      relinearize_threshold: 0.01
      relinearize_skip: 1

    # Prior factor covariance on the first state (anchors the graph origin)
    # [x, y, z, roll, pitch, yaw] diagonal variances
    prior:
      pose_cov: [1.0e-2, 1.0e-2, 1.0e-2, 1.0e-2, 1.0e-2, 1.0e-2]

    # Map persistence paths
    map:
      load_path: "/opt/watonomous/maps/wrestrc.map"   # Prior map for localization
      save_path: ""                                    # No saving in localization mode

    # Published topics, services, and odometry covariance
    topics:
      pose: "slam/pose"                    # PoseStamped in map frame (consumed by eidos_transform)
      status: "slam/status"                # SlamStatus message (state, keyframe count, etc.)
      odom: "slam/odometry"                # Odometry in map frame with covariance
      odom_pose_cov: [1.0e-3, 1.0e-3, 1.0e-3, 1.0e-4, 1.0e-4, 1.0e-4]  # Diagonal pose covariance on odom topic [x,y,z,roll,pitch,yaw]
      save_map_service: "slam/save_map"
      load_map_service: "slam/load_map"

    # Plugin lists (loaded in order)
    factor_plugins:
      - "gps_factor"
      - "liso_factor"
      - "imu_factor"

    relocalization_plugins:
      - "gps_icp_relocalization"
      - "bnb_voxel_relocalization"

    visualization_plugins:
      - "keyframe_map_visualization"

    # IMU Factor (publishes odom for eidos_transform, no factors injected)
    imu_factor:
      plugin: "eidos::ImuFactor"
      add_factors: false                        # No graph factors — odom output only
      odom_topic: "imu_factor/odometry"         # Published odometry topic
      imu_topic: "/novatel/oem7/imu/data"       # IMU input
      imu_frame: "imu_link"                     # IMU TF frame
      gravity: 9.80511                          # Gravity magnitude (m/s^2)
      acc_cov: [6.9e-7, 6.9e-7, 6.9e-7]        # Accelerometer noise covariance
      gyr_cov: [8.5e-10, 8.5e-10, 8.5e-10]     # Gyroscope noise covariance
      integration_cov: [1.0e-8, 1.0e-8, 1.0e-8]  # Integration uncertainty covariance
      default_imu_dt: 0.002                     # Default dt for first IMU message (s)

    # GPS Factor (loads utm_to_map offset from prior map, no factors injected)
    gps_factor:
      plugin: "eidos::GpsFactor"
      add_factors: false                        # No graph factors — UTM offset only
      gps_topic: "/novatel/oem7/fix"
      imu_topic: "/novatel/oem7/imu/data"
      max_cov: 5.0                              # Reject fixes with covariance above this
      use_elevation: true                       # Include GPS altitude
      min_radius: 200.0                         # Min distance from origin before adding factors (m)
      pose_cov_threshold: 1.0                   # Graph pose covariance threshold
      gps_cov: [2.0, 2.0, 4.0]                 # GPS factor noise [x, y, z] (m)

    # LISO Factor (scan-to-submap matching against prior map)
    liso_factor:
      plugin: "eidos::LisoFactor"
      add_factors: false                                   # No graph factors — odom output only
      submap_source: "prior_map"                           # Match against stored map clouds
      lidar_topic: "/lidar_cc/velodyne_points"
      odom_topic: "liso/odometry"
      odometry_incremental_topic: "liso/odometry_incremental"
      imu_topic: "/novatel/oem7/imu/data"
      lidar_frame: "lidar_cc"
      imu_frame: "imu_link"
      initialization:
        warmup_samples: 200                                # IMU samples before LISO starts
        stationary_gyr_threshold: 0.005                    # Gyro threshold for stationary detection (rad/s)
      scan_ds_resolution: 0.5                              # Voxel downsample for scans (m)
      submap_ds_resolution: 0.5                            # Voxel downsample for submap (m)
      num_neighbors: 10
      submap_radius: 30.0                                  # Larger radius for prior map matching (m)
      max_submap_states: 15                                # More keyframes for broader matching context
      max_correspondence_distance: 2.0
      max_iterations: 20
      num_threads: 16
      min_inliers: 50
      min_noise: 0.01
      min_scan_distance: 5.0
      odom_pose_cov: [0.01, 0.01, 0.005, 1.0e-6, 1.0e-6, 1.0e-3]
      odom_twist_cov: [1.0e-4, 1.0e-4, 1.0e-8, 1.0e-10, 1.0e-10, 1.0e-6]

    # GPS + ICP Relocalization
    gps_icp_relocalization:
      plugin: "eidos::GpsIcpRelocalization"
      gps_topic: "/novatel/oem7/fix"
      lidar_topic: "/lidar_cc/velodyne_points"
      imu_topic: "/novatel/oem7/imu/data"
      lidar_frame: "lidar_cc"
      imu_frame: "imu_link"
      gps_candidate_radius: 30.0
      pointcloud_from: "liso_factor/cloud"
      gps_from: "gps_factor"
      scan_ds_resolution: 0.5
      submap_leaf_size: 0.4
      max_correspondence_distance: 2.0
      max_icp_iterations: 100
      num_threads: 16
      num_neighbors: 10
      fitness_threshold: 0.3

    # Branch-and-Bound Voxel Relocalization (GPS-free global search)
    # Fallback when GPS is unavailable: builds a multi-resolution voxel pyramid
    # from the prior map and searches (x, y, z, yaw) with no positional prior.
    bnb_voxel_relocalization:
      plugin: "eidos::BnbVoxelRelocalization"
      lidar_topic: "/lidar_cc/velodyne_points"
      imu_topic: "/novatel/oem7/imu/data"
      lidar_frame: "lidar_cc"
      imu_frame: "imu_link"
      pointcloud_from: "liso_factor/cloud"     # Prior-map cloud source
      min_voxel_size: 1.0                      # Finest pyramid level (m)
      num_levels: 4                            # Coarsest level = 1.0 * 2^3 = 8 m (coarser saturates the BnB bound)
      # Distance-field score (new default): per-point cell value round(255*exp(-d^2/(2*sigma^2))),
      # d = distance to the nearest map point, truncated at df_truncation_voxels. Replaces the
      # binary occupancy score, which was measured on ring_road.map to carry almost no alignment
      # signal (a randomly rotated scan already hits 76% of query points at +/-1 voxel, and the
      # true yaw ranked only 5th of 36 -- see the doc page's Status section). IMPLEMENTED BUT NOT
      # YET VALIDATED to produce a lock -- no measurement exists yet with this scorer.
      score_mode: "distance_field"             # "distance_field" (new default) or "occupancy" (today's ternary score, kept to A/B the two scorers). An unrecognised value WARNs and falls back to "distance_field"
      df_sigma: 1.0                            # Distance-field falloff sigma (m); ~= the measured ~1 m query-to-map registration offset to absorb
      df_truncation_voxels: 2                  # Distance-field kernel radius, in level-0 voxels
      max_score_voxels: 40000000               # Guard on the distance-field grid size; on overflow, falls back to occupancy scoring for the session and WARNs
      min_height: 0.6                          # Body-frame z band lower bound (m) -- removes ground returns; 0 disables. Also bounds the free-space channel (kept in sync by construction, see use_free_space below)
      max_height: 6.0                          # Body-frame z band upper bound (m); 0 disables. Also bounds the free-space channel
      max_voxels_per_level: 8000000            # Above this, probe neighbourhood on the fly instead of dilating
      max_query_range: 40.0                    # Drop query points beyond this range (m); caps coarse yaw bins
      target_query_points: 400                 # Live scan downsample target (search cost is linear in this)
      rp_search_range: 0.02                    # Roll/pitch half-range (rad)
      rp_search_steps: 1                       # 1 = trust IMU gravity; N steps costs N^2 searches
      prefer_downsampled_source: false          # true = rasterize from the pre-downsampled gicp_cloud (~2x faster build, lower match scores)
      root_prefilter_points: 128                # Query subsample size for the cheap coarse root prefilter
      root_prefilter_keep: 256                  # Roots surviving the prefilter into full BnB (<=0 disables)
      search_corridor: 30.0                    # Search within this distance of the driven trajectory (m). Must cover both
                                                # how far the vehicle may start off the mapped driving line (measured 19.9 m
                                                # on the validation bag) AND the coarsest-level root cell's own extent
                                                # (buildRoots() keeps a cell if its NEAREST point is in-corridor, so the
                                                # margin needs headroom beyond the raw off-trajectory distance alone).
      z_margin: 5.0                            # Vertical search margin about trajectory height (m)
      max_search_nodes: 200000                 # Total BnB node budget per search (anytime bound)
      prune_slack: 0.8                         # Relax BnB pruning so runners-up survive the uniqueness gate
      nms_radius: 5.0                          # Distinct-solution separation (m)
      # normalized = raw / max_possible in BOTH score modes (see score_mode above). Under
      # score_mode=occupancy this is the ternary score: hit=hit_weight, unknown=1, known-free=0,
      # max_possible=hit_weight*n; an all-unknown pose floors at 1/hit_weight (0.33 at the
      # default) rather than 0. Under score_mode=distance_field, normalized is instead the MEAN
      # PER-POINT CELL VALUE scaled to [0,1] (max_possible=255*n) -- not a hit fraction -- so these
      # two thresholds keep their default VALUES but mean something different depending on mode;
      # see Hypothesis::hit_fraction in every log line for the mode-independent hit-rate figure.
      min_match_score: 0.45                    # Minimum normalized BnB score required to accept a hypothesis
      min_score_ratio: 1.20                    # Winner's normalized score must beat the best distinct runner-up's by this factor
      num_gicp_candidates: 5                   # Hypotheses handed to GICP
      min_inlier_ratio: 0.30                    # GICP acceptance threshold
      scan_ds_resolution: 0.5                  # Voxel downsample for GICP scan (m)
      submap_radius: 40.0                      # Radius for GICP submap assembly (m)
      submap_leaf_size: 0.4                    # Voxel downsample for GICP submap (m)
      max_correspondence_distance: 2.0         # GICP max correspondence distance (m)
      max_icp_iterations: 100                  # GICP max iterations
      num_threads: 16
      num_neighbors: 10
      publish_debug_grid: true                 # Latched OccupancyGrid of the map voxel pyramid
      debug_grid_topic: "slam/visualization/reloc_voxel_grid"
      # Free-space channel: a query point landing in known-empty map space counts as negative
      # evidence (weight 0) instead of merely absent evidence (weight 1, "unknown"). ONLY MEANINGFUL
      # under score_mode=occupancy -- under score_mode=distance_field this channel is never built or
      # raycast (see the class doc), because a distance field already scores a point far from all
      # structure at ~0, continuously, which is what this three-state score was approximating.
      # use_free_space: false reproduces the plain binary hit-count score exactly (ranking is
      # bit-identical, since raw = (hit_weight-1)*hits + n is monotone in the hit count).
      # DEFAULT OFF, deliberately. On ring_road.map it did not improve the lock, because the
      # occupancy score it refines was measured to carry almost no alignment signal there: at
      # +/-1 voxel a RANDOMLY rotated scan already hits 76% of query points, so the 0.6-6.0 m band
      # along that tree-lined route is very nearly space-filling at 1 m resolution. That makes the
      # measurement inconclusive about free space rather than negative, so the channel stays
      # available and sound but is not switched on by default on unproven evidence. Re-evaluate it
      # once the scoring function itself discriminates (see the doc page's Status section).
      use_free_space: false                    # Master switch for the free-space scoring channel (occupancy mode only)
      free_rays_per_keyframe: 2000             # Stride each keyframe's cloud to ~this many free-space rays; <=0 uses every point
      free_max_range: 40.0                     # Clamp free-space ray length (m)
      free_end_margin: 1.0                     # Stop each ray this many metres short of its endpoint (m); the surface itself is never marked free
      free_clear_near_occupied: true           # Delete free voxels that are occupied or 26-adjacent to occupied, so registration jitter isn't penalised
      max_free_voxels: 20000000                # Budget guard; over this, free space is abandoned entirely for the session (sound: loosens the bound)
      free_ray_origin_height: 2.0              # Fallback ray-origin height (m) above base_link if the base_link<-lidar TF hasn't resolved yet at build time
      hit_weight: 3                            # Per-point weight for an occupied hit in the ternary score (raw score in [0, hit_weight * n])

    # Keyframe Map Visualization
    keyframe_map_visualization:
      plugin: "eidos::KeyframeMapVisualization"
      topic: "slam/visualization/map"
      pointcloud_from: "liso_factor/cloud"
      voxel_leaf_size: 0.4
      publish_rate: 1.0
      mode: "accumulate"
      accumulate:
        skip_factor: 20
      windowed:
        radius: 50.0

# eidos_transform config for localization mode (dual-EKF)
/**/eidos_transform_node:
  ros__parameters:
    tick_rate: 200.0
    frames:
      odom: "odom"
      base_link: "base_footprint"
      map: "map"
      utm: "utm"
    topics:
      odom: "transform/odometry"
      utm_to_map: "gps_factor/utm_to_map_tf"
      predict_service: "transform/predict_relative"
    ekf:
      plugin: "eidos_transform::HolonomicEKF"
      name: "holonomic_ekf"
    # [pose(6), velocity(6), accel_bias(3)]
    holonomic_ekf:
      process_noise:
        [1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4,
         1.0e-2, 1.0e-2, 1.0e-2, 1.0e-2, 1.0e-2, 1.0e-2,
         1.0e-6, 1.0e-6, 1.0e-6]
    holonomic_ekf_global:
      process_noise:
        [1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3,
         1.0e-1, 1.0e-1, 1.0e-1, 1.0e-1, 1.0e-1, 1.0e-1,
         1.0e-6, 1.0e-6, 1.0e-6]
    odom_sources:
      - "liso_odom"
      - "imu_raw"
    liso_odom:
      type: "odom"
      topic: "liso/odometry_incremental"
      pose_mask: [true, true, true, true, true, true]
      twist_mask: [true, true, true, true, true, true]
      pose_noise: [1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3]
      # [ang_x, ang_y, ang_z, lin_x, lin_y, lin_z]
      twist_noise: [5.0e-2, 5.0e-2, 5.0e-2, 1.0e-1, 3.0e-2, 3.0e-2]
    imu_raw:
      type: "imu"
      topic: "/novatel/oem7/imu/data"
      imu_frame: "imu_link"
      use_orientation: true
      use_angular_velocity: true
      use_linear_acceleration: true
      gravity: 9.80511
      gravity_compensated: false
      orientation_noise: [1.0e-2, 1.0e-2, 1.0e-2, 1.0, 1.0, 1.0]
      angular_velocity_noise: [1.0e-3, 1.0e-3, 1.0e-3, 1.0, 1.0, 1.0]
      linear_velocity_noise: [1.0, 1.0, 1.0, 1.0e-1, 1.0e-1, 1.0e-1]
    map_sources:
      - "liso_map"
    liso_map:
      type: "odom"
      topic: "liso/odometry"
      pose_mask: [true, true, true, true, true, true]
      twist_mask: [false, false, false, false, false, false]
      pose_noise: [1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3]
      twist_noise: [1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3]
