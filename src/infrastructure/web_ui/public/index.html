<!DOCTYPE html>
<html>
  <head><title>EVE UI</title></head>
  <body>
    <h1>EVE</h1>
    <p>Speed: <span id="speed">--</span> m/s</p>

    <canvas id="map" width="600" height="600" style="border:2px solid #333; cursor:crosshair;"></canvas>
    <p id="status"></p>
    <p id="routeStatus"></p>

    <script>
      const ws = new WebSocket(`ws://${location.host}`);
      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.speed !== undefined) {
          document.getElementById('speed').textContent = data.speed.toFixed(2);
        }
        if (data.type === 'routeResult') {
          const el = document.getElementById('routeStatus');
          if (data.success) {
            el.textContent = `Route set! Goal lanelet: ${data.goalLanelet}`;
            el.style.color = 'green';
          } else {
            el.textContent = `Route failed: ${data.error}`;
            el.style.color = 'red';
          }
        }
      };

      const canvas = document.getElementById('map');
      const ctx = canvas.getContext('2d');

      // transform state, filled in once the map is parsed
      let transform = null;

      async function loadMap() {
        const res = await fetch('/map/test_track_050426_utm.osm');
        const text = (await res.text()).trim();
        const xml = new DOMParser().parseFromString(text, 'text/xml');

        console.log('raw text length:', text.length, 'first 200:', text.slice(0, 200));
        console.log('nodes found:', xml.getElementsByTagName('node').length);
        console.log('parse error:', xml.querySelector('parsererror')?.textContent);

        // 1. parse nodes: id -> {x, y} in local meters
        const nodes = {};
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const node of xml.querySelectorAll('node')) {
          const id = node.getAttribute('id');
          const xt = node.querySelector('tag[k="local_x"]');
          const yt = node.querySelector('tag[k="local_y"]');
          if (!xt || !yt) continue;
          const x = parseFloat(xt.getAttribute('v'));
          const y = parseFloat(yt.getAttribute('v'));
          nodes[id] = { x, y };
          minX = Math.min(minX, x); maxX = Math.max(maxX, x);
          minY = Math.min(minY, y); maxY = Math.max(maxY, y);
        }

        console.log('parsed nodes:', Object.keys(nodes).length, 'bounds:', minX, maxX, minY, maxY);

        // 2. build a transform: map-meters -> canvas-pixels, fit with margin
        const margin = 20;
        const scaleX = (canvas.width  - 2*margin) / (maxX - minX);
        const scaleY = (canvas.height - 2*margin) / (maxY - minY);
        const scale = Math.min(scaleX, scaleY);   // uniform, keep aspect ratio
        transform = { minX, minY, maxX, maxY, scale, margin };

        // 3. draw each way as a connected line
        ctx.strokeStyle = '#888';
        ctx.lineWidth = 1;
        for (const way of xml.querySelectorAll('way')) {
          ctx.beginPath();
          let first = true;
          for (const nd of way.querySelectorAll('nd')) {
            const n = nodes[nd.getAttribute('ref')];
            if (!n) continue;
            const p = mapToPixel(n.x, n.y);
            if (first) { ctx.moveTo(p.px, p.py); first = false; }
            else ctx.lineTo(p.px, p.py);
          }
          ctx.stroke();
        }
      }

      // map meters -> canvas pixels (y flipped: map y-up, canvas y-down)
      function mapToPixel(x, y) {
        const t = transform;
        return {
          px: t.margin + (x - t.minX) * t.scale,
          py: canvas.height - t.margin - (y - t.minY) * t.scale
        };
      }

      // canvas pixels -> map meters (inverse, for clicks)
      function pixelToMap(px, py) {
        const t = transform;
        return {
          x: (px - t.margin) / t.scale + t.minX,
          y: (canvas.height - t.margin - py) / t.scale + t.minY
        };
      }

      canvas.addEventListener('click', (event) => {
        if (!transform) return;
        const rect = canvas.getBoundingClientRect();
        const px = event.clientX - rect.left;
        const py = event.clientY - rect.top;
        const m = pixelToMap(px, py);   // real map coordinates!
        ws.send(JSON.stringify({ type: 'setDestination', x: m.x, y: m.y }));
        document.getElementById('status').textContent =
          `Destination: (${m.x.toFixed(1)}, ${m.y.toFixed(1)}) m`;

        // dot where you clicked
        ctx.fillStyle = 'red';
        ctx.beginPath();
        ctx.arc(px, py, 5, 0, 2*Math.PI);
        ctx.fill();
      });

      loadMap();
    </script>
  </body>
</html>
