<!DOCTYPE html>
<html>
  <head>
    <title>EVE UI</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #000; }
      body { font-family: -apple-system, system-ui, sans-serif; color: #fff; }

      #map { display: block; width: 100vw; height: 100vh; background: #141418; }

      #speedBox {
        position: fixed; top: 20px; left: 24px;
        background: rgba(20,20,24,0.7); backdrop-filter: blur(8px);
        padding: 10px 20px; border-radius: 12px;
        display: flex; flex-direction: column; align-items: center; line-height: 1;
      }
      #speed { font-size: 2.6em; font-weight: 700; }
      #speedBox .unit { font-size: 0.7em; color: #999; letter-spacing: 3px; margin-top: 4px; }

      #infoBar {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        background: rgba(20,20,24,0.8); backdrop-filter: blur(8px);
        padding: 14px 28px; border-radius: 14px; text-align: center; min-width: 260px;
      }
      #routeStatus { font-weight: 600; min-height: 1.2em; }
      #destInfo { font-size: 0.9em; color: #ccc; margin: 8px 0; }

      #btnRow { margin-top: 6px; display: flex; gap: 10px; justify-content: center; }
      #goBtn {
        padding: 10px 34px; font-size: 1.1em; font-weight: 700;
        color: #fff; background: #3ddc84; border: none; border-radius: 10px;
        cursor: pointer; letter-spacing: 2px;
      }
      #goBtn:active { background: #2fb56a; }
      #cancelBtn {
        padding: 10px 28px; font-size: 1.1em; font-weight: 700;
        color: #fff; background: #555; border: none; border-radius: 10px;
        cursor: pointer; letter-spacing: 2px;
      }
      #cancelBtn:active { background: #444; }
      #exitBtn {
        margin-top: 8px; padding: 10px 34px; font-size: 1.1em; font-weight: 700;
        color: #fff; background: #ff3b30; border: none; border-radius: 10px;
        cursor: pointer; letter-spacing: 2px;
      }
      #exitBtn:active { background: #d32f27; }
    </style>
  </head>
  <body>
    <canvas id="map"></canvas>

    <div id="speedBox">
      <span id="speed">--</span>
      <span class="unit">M/S</span>
    </div>

    <div id="infoBar">
      <div id="routeStatus">Tap the map to set a destination</div>
      <div id="destInfo" style="display:none;"></div>
      <div id="btnRow" style="display:none;">
        <button id="goBtn">GO</button>
        <button id="cancelBtn">CANCEL</button>
      </div>
      <button id="exitBtn" style="display:none;">EXIT</button>
    </div>

    <script>
      const ws = new WebSocket(`ws://${location.host}`);
      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.speed !== undefined) {
          document.getElementById('speed').textContent = data.speed.toFixed(0);
        }
        if (data.type === 'routeResult') {
          const el = document.getElementById('routeStatus');
          if (data.success) {
            el.textContent = `Route set → lanelet ${data.goalLanelet}`;
            el.style.color = '#3ddc84';
            document.getElementById('exitBtn').style.display = 'inline-block';
          } else {
            el.textContent = `Route failed: ${data.error}`;
            el.style.color = '#ff5a5a';
          }
        }
        if (data.type === 'route') {
          route = data.points;
          draw();
        }
        if (data.type === 'ego') {
          ego = { x: data.x, y: data.y, yaw: data.yaw };
          draw();
        }
      };

      const canvas = document.getElementById('map');
      const ctx = canvas.getContext('2d');

      let transform = null;
      let clickMarker = null;
      let pendingDest = null;
      let ego = null;
      let route = [];
      let rawNodes = null, rawWays = null, bounds = null;

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        if (bounds) { buildTransform(); draw(); }
      }
      window.addEventListener('resize', resizeCanvas);

      async function loadMap() {
        const text = (await fetch('/map/test_track_050426_utm.osm').then(r => r.text())).trim();
        const xml = new DOMParser().parseFromString(text, 'text/xml');

        rawNodes = {};
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const node of xml.getElementsByTagName('node')) {
          const id = node.getAttribute('id');
          let x = null, y = null;
          for (const tag of node.getElementsByTagName('tag')) {
            if (tag.getAttribute('k') === 'local_x') x = parseFloat(tag.getAttribute('v'));
            if (tag.getAttribute('k') === 'local_y') y = parseFloat(tag.getAttribute('v'));
          }
          if (x === null || y === null) continue;
          rawNodes[id] = { x, y };
          minX = Math.min(minX, x); maxX = Math.max(maxX, x);
          minY = Math.min(minY, y); maxY = Math.max(maxY, y);
        }
        bounds = { minX, minY, maxX, maxY };

        rawWays = [];
        for (const way of xml.getElementsByTagName('way')) {
          const refs = [];
          for (const nd of way.getElementsByTagName('nd')) {
            const n = rawNodes[nd.getAttribute('ref')];
            if (n) refs.push(n);
          }
          if (refs.length) rawWays.push(refs);
        }

        buildTransform();
        draw();
      }

      function buildTransform() {
        const margin = 40;
        const scale = Math.min(
          (canvas.width  - 2*margin) / (bounds.maxX - bounds.minX),
          (canvas.height - 2*margin) / (bounds.maxY - bounds.minY)
        );
        const offsetX = (canvas.width  - (bounds.maxX - bounds.minX) * scale) / 2;
        const offsetY = (canvas.height - (bounds.maxY - bounds.minY) * scale) / 2;
        transform = { scale, offsetX, offsetY, minX: bounds.minX, minY: bounds.minY };
      }

      function mapToPixel(x, y) {
        const t = transform;
        return {
          px: t.offsetX + (x - t.minX) * t.scale,
          py: canvas.height - t.offsetY - (y - t.minY) * t.scale
        };
      }
      function pixelToMap(px, py) {
        const t = transform;
        return {
          x: (px - t.offsetX) / t.scale + t.minX,
          y: (canvas.height - t.offsetY - py) / t.scale + t.minY
        };
      }

      function draw() {
        ctx.fillStyle = '#141418';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (const refs of rawWays) {
          const pts = refs.map(n => mapToPixel(n.x, n.y));
          ctx.strokeStyle = 'rgba(80,80,85,0.35)';
          ctx.lineWidth = 5; strokePath(pts);
          ctx.strokeStyle = 'rgba(120,120,128,0.9)';
          ctx.lineWidth = 1.5; strokePath(pts);
        }

        if (route.length > 1) {
          const pts = route.map(p => mapToPixel(p.x, p.y))
                           .filter(p => isFinite(p.px) && isFinite(p.py));
          if (pts.length > 1) {
            ctx.strokeStyle = 'rgba(77,163,255,0.3)';
            ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            strokePath(pts);
            ctx.strokeStyle = '#4da3ff';
            ctx.lineWidth = 4;
            strokePath(pts);
          }
        }

        if (clickMarker) {
          const { px, py } = mapToPixel(clickMarker.x, clickMarker.y);
          drawPin(px, py);
        }

        if (ego) {
          const { px, py } = mapToPixel(ego.x, ego.y);
          drawEgo(px, py, ego.yaw);
        }
      }

      function drawPin(px, py) {
        ctx.fillStyle = '#ff3b30';
        ctx.beginPath();
        ctx.arc(px, py - 18, 9, Math.PI, 0);
        ctx.lineTo(px, py);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.arc(px, py - 18, 9, 0, 2*Math.PI);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(px, py - 18, 3.5, 0, 2*Math.PI);
        ctx.fill();
      }

      function drawEgo(px, py, yaw) {
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(-yaw - Math.PI/2);
        ctx.beginPath();
        ctx.moveTo(0, -14);
        ctx.lineTo(10, 10);
        ctx.lineTo(0, 5);
        ctx.lineTo(-10, 10);
        ctx.closePath();
        ctx.fillStyle = '#ff3b30';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.lineJoin = 'round';
        ctx.stroke();
        ctx.restore();
      }

      function strokePath(pts) {
        ctx.beginPath();
        pts.forEach((p, i) => i ? ctx.lineTo(p.px, p.py) : ctx.moveTo(p.px, p.py));
        ctx.stroke();
      }

      function resetToStart() {
        pendingDest = null;
        clickMarker = null;
        route = [];
        draw();
        document.getElementById('destInfo').style.display = 'none';
        document.getElementById('btnRow').style.display = 'none';
        document.getElementById('exitBtn').style.display = 'none';
        const rs = document.getElementById('routeStatus');
        rs.textContent = 'Tap the map to set a destination';
        rs.style.color = '#fff';
      }

      // click: place pin, show coords + distance + GO/CANCEL, clear old result
      canvas.addEventListener('click', (event) => {
        if (!transform) return;
        const rect = canvas.getBoundingClientRect();
        const px = event.clientX - rect.left;
        const py = event.clientY - rect.top;
        const m = pixelToMap(px, py);
        clickMarker = { x: m.x, y: m.y };
        pendingDest = { x: m.x, y: m.y };
        draw();

        let distText = '';
        if (ego) {
          const dist = Math.hypot(m.x - ego.x, m.y - ego.y);
          distText = ` · ${dist.toFixed(1)} m away`;
        }
        document.getElementById('destInfo').textContent =
          `(${m.x.toFixed(1)}, ${m.y.toFixed(1)}) m${distText}`;
        document.getElementById('destInfo').style.display = 'block';
        document.getElementById('btnRow').style.display = 'flex';
        document.getElementById('exitBtn').style.display = 'none';

        const rs = document.getElementById('routeStatus');
        rs.textContent = '';
        rs.style.color = '#fff';
      });

      // GO: send request, hide buttons
      document.getElementById('goBtn').addEventListener('click', () => {
        if (!pendingDest) return;
        ws.send(JSON.stringify({ type: 'setDestination', x: pendingDest.x, y: pendingDest.y }));
        document.getElementById('btnRow').style.display = 'none';
        const rs = document.getElementById('routeStatus');
        rs.textContent = 'Routing…';
        rs.style.color = '#fff';
      });

      // CANCEL: back to empty screen
      document.getElementById('cancelBtn').addEventListener('click', resetToStart);

      // EXIT: clear active route, back to empty screen
      document.getElementById('exitBtn').addEventListener('click', resetToStart);

      resizeCanvas();
      loadMap();
    </script>
  </body>
</html>
