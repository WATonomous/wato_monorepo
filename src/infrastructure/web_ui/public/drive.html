<!DOCTYPE html>
<html>
  <head>
    <title>EVE Drive View</title>
    <style>
      * { margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; background: #0a0a0f; }
      #drive { display: block; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <canvas id="drive"></canvas>

    <script type="module">
      import * as THREE from '/lib/three.module.js';
      import {STLLoader} from '/lib/STLLoader.js';

      const canvas = document.getElementById('drive');

      // renderer — draws the scene onto the canvas
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);

      // scene — the 3D world
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0a0f);

      // camera — perspective, positioned behind & above the car looking forward
      const camera = new THREE.PerspectiveCamera(
        60,                                   // field of view
        window.innerWidth / window.innerHeight, // aspect ratio
        0.1, 1000                             // near / far clip
      );
      camera.position.set(0, 6, -12);   // behind (−z) and above (+y) the car
      camera.lookAt(0, 0, 10);          // look forward (+z)

      // chase-cam working values
      const UP        = new THREE.Vector3(0, 1, 0);
      const camOffset = new THREE.Vector3(0, 6, -12);  // behind (−z) + above (+y), in the CAR's local frame
      const camTarget = new THREE.Vector3();           // scratch: where the camera wants to be this frame
      const camFocus  = new THREE.Vector3();           // eased point the camera orbits (follows the car)
      let camYaw = 0;                                  // eased heading

      const car = new THREE.Group();
      scene.add(car);

      const loader = new STLLoader();
      loader.load('./models/kia_soul_ev.stl', (geometry) => {
        function makeMatcap(base = '#c4c4c4') {  
          const s = 256;
          const cv = document.createElement('canvas');
          cv.width = cv.height = s;
          const ctx = cv.getContext('2d');
          const g = ctx.createRadialGradient(s*0.38, s*0.32, s*0.04,  s*0.5, s*0.5, s*0.5);
          g.addColorStop(0.0, '#e2e2e2');   // highlight 
          g.addColorStop(0.45, base);       // body tone
          g.addColorStop(1.0, '#242424');   // dark edge 
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(s/2, s/2, s/2, 0, Math.PI*2);
          ctx.fill();
          return new THREE.CanvasTexture(cv);
        }

        const mesh = new THREE.Mesh(
          geometry,
          new THREE.MeshMatcapMaterial({ matcap: makeMatcap() })
        );

        mesh.scale.setScalar(0.01);        // cm → meters
        mesh.rotation.x = -Math.PI / 2;    // Z-up model → Y-up scene

        car.add(mesh);
      }, undefined, (err) => console.error('STL load failed:', err));

      // drag-to-look state 
      let dragging  = false;
      let lastX = 0, lastY = 0;
      let lookYaw = 0, lookPitch = 0;   // extra angles while dragging; ease back to 0 on release

      // light — so surfaces aren't flat black
      const ambient = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambient);
      const dir = new THREE.DirectionalLight(0xffffff, 0.8);
      dir.position.set(5, 10, 5);
      scene.add(dir);

      // ground plane
      const groundGeo = new THREE.PlaneGeometry(200, 200);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1a22 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;   // lay it flat (default plane is vertical)
      scene.add(ground);

      // grid overlay so motion/scale is visible
      const grid = new THREE.GridHelper(200, 40, 0x333344, 0x222230);
      scene.add(grid);        

      // container for tracked-object boxes (rebuilt each message)
      const objectsGroup = new THREE.Group();
      scene.add(objectsGroup);
      // tracking pool: object id → { mesh, target{x,z,yaw}, seen }
      const objectPool = new Map();

      // lane geometry (rebuilt each message)
      const laneletGroup = new THREE.Group();
      scene.add(laneletGroup);
      const ROAD_H = 0.03;  

      const CLASS_COLORS = {
        'person': 0x00e676,   // green — pedestrians
        'car':    0x2196f3,   // blue  — cars
      };
      const CLASS_COLOR_DEFAULT = 0x888888;

      function makeLaneLine(pts, color, dashed = false) {
        const geo = new THREE.BufferGeometry().setFromPoints(
          pts.map((p) => new THREE.Vector3(p.x, ROAD_H, -p.y))  
        );
        const mat = dashed
          ? new THREE.LineDashedMaterial({ color, dashSize: 1, gapSize: 1 })
          : new THREE.LineBasicMaterial({ color });
        const line = new THREE.Line(geo, mat);
        if (dashed) line.computeLineDistances();   
        return line;
      }

      function makeRoadRibbon(centerline, halfWidth) {
        const positions = [];
        const n = centerline.length;
        for (let i = 0; i < n; i++) {
          // tangent direction at this point (from neighbors)
          const a = centerline[Math.max(0, i - 1)];
          const b = centerline[Math.min(n - 1, i + 1)];
          let tx = b.x - a.x, ty = b.y - a.y;
          const len = Math.hypot(tx, ty) || 1;
          tx /= len; ty /= len;
          // left-normal in ROS (x,y): (-ty, tx). offset the centerline point both ways.
          const c = centerline[i];
          const lx = c.x - ty * halfWidth, ly = c.y + tx * halfWidth;   // left edge
          const rx = c.x + ty * halfWidth, ry = c.y - tx * halfWidth;   // right edge
          // ROS→three: three.x=x, three.z=-y
          positions.push(lx, 0, -ly,   rx, 0, -ry);   
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      
        const idx = [];
        for (let i = 0; i < n - 1; i++) {
          const o = i * 2;
          idx.push(o, o + 1, o + 2,   o + 2, o + 1, o + 3);
        }
        geo.setIndex(idx);
        geo.computeVertexNormals();
        const mat = new THREE.MeshStandardMaterial({
          color: 0x2a2a30, side: THREE.DoubleSide,   
          roughness: 1.0, metalness: 0.0,
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.y = 0.02;   
        return mesh;
      }

      function laneHalfWidth(L) {
        if (L.left.length && L.right.length) {
          const dx = L.left[0].x - L.right[0].x;
          const dy = L.left[0].y - L.right[0].y;
          const w = Math.hypot(dx, dy) / 2;
          if (w > 0.5 && w < 6) return w *1.05;  
        }
        return 2;  
      }

      canvas.addEventListener('mousedown', (e) => {
        dragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
      });
      window.addEventListener('mouseup', () => { dragging = false; });   // release anywhere
      window.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        lookYaw   -= (e.clientX - lastX) * 0.005;   // drag right → swing right
        lookPitch += (e.clientY - lastY) * 0.005;   // drag down → tilt down
        lookPitch = Math.max(-0.4, Math.min(1.2, lookPitch));  // clamp so you can't flip under/over
        lastX = e.clientX;
        lastY = e.clientY;
      });

      function animate() {
        requestAnimationFrame(animate);

        // ease the HEADING toward the car's, going the short way round. rotating
        // the offset by an eased angle keeps the camera on a fixed-radius orbit,
        // so it no longer dives across big turns (that was the "zoom").
        let d = car.rotation.y - camYaw;
        d = Math.atan2(Math.sin(d), Math.cos(d));   // shortest signed angle
        camYaw += d * 0.1;

        camFocus.lerp(car.position, 0.15);          // ease the orbit point to the car

        // keep ground + grid under the car (both are finite; the car roams far in map frame)
        ground.position.x = car.position.x;
        ground.position.z = car.position.z;
        // snap the grid to whole cells so it reads as the world scrolling past,
        // not a rigid sheet glued to the car
        const cell = 200 / 40;   // GridHelper size / divisions = 5 m per cell
        grid.position.x = Math.round(car.position.x / cell) * cell;
        grid.position.z = Math.round(car.position.z / cell) * cell;

        // when not dragging, ease the look offsets back to zero → snaps back to chase cam
        if (!dragging) {
          lookYaw   *= 0.85;
          lookPitch *= 0.85;
        }

        // base chase angle + temporary drag offset
        camTarget.copy(camOffset)
                 .applyAxisAngle(new THREE.Vector3(1, 0, 0), lookPitch)  // tilt
                 .applyAxisAngle(UP, camYaw + lookYaw)                    // swing (chase + drag)
                 .add(camFocus);
        camera.position.copy(camTarget);
        camera.lookAt(camFocus);

        renderer.render(scene, camera);

         // glide every tracked box toward its latest target
        for (const { mesh, target } of objectPool.values()) {
          mesh.position.x += (target.x - mesh.position.x) * 0.2;
          mesh.position.z += (target.z - mesh.position.z) * 0.2;
          // ease yaw the short way round
          let dy = target.yaw - mesh.rotation.y;
          dy = Math.atan2(Math.sin(dy), Math.cos(dy));
          mesh.rotation.y += dy * 0.2;
        }
      }
      animate();

      // ── ego pose from ROS
      // server broadcasts { type:'ego', x, y, yaw } from /world_modeling/slam/pose
      const ws = new WebSocket(`ws://${location.host}`);
      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'ego') {
          car.position.x =  data.x;
          car.position.z = -data.y;              
          car.rotation.y =  data.yaw + Math.PI / 2;

        }

        if (data.type === 'objects') {
          for (const entry of objectPool.values()) entry.seen = false;

          for (const o of data.objects) {
            const tx = o.x, tz = -o.y, tyaw = o.yaw;  
            let entry = objectPool.get(o.id);

            if (!entry) {
              const geo = new THREE.BoxGeometry(o.sx, o.sz, o.sy);
              const color = CLASS_COLORS[o.cls] ?? CLASS_COLOR_DEFAULT;
              const mat = new THREE.MeshStandardMaterial({
                color, transparent: true, opacity: 0.55
              });
              const box = new THREE.Mesh(geo, mat);
              box.position.set(tx, o.z, tz);   
              box.rotation.y = tyaw;
              objectsGroup.add(box);
              entry = { mesh: box, target: { x: tx, z: tz, yaw: tyaw }, seen: true };
              objectPool.set(o.id, entry);
            } else {
              
              entry.target.x = tx;
              entry.target.z = tz;
              entry.target.yaw = tyaw;
              entry.mesh.position.y = o.z;  
              entry.seen = true;
            }
          }

          for (const [id, entry] of objectPool) {
            if (!entry.seen) {
              objectsGroup.remove(entry.mesh);
              entry.mesh.geometry.dispose();
              entry.mesh.material.dispose();
              objectPool.delete(id);
            }
          }
        }

        if (data.type === 'lanelet') {
          for (const c of laneletGroup.children) {
            c.geometry.dispose();
            c.material.dispose();
          }
          laneletGroup.clear();

          for (const L of data.lanelets) {
            if (L.centerline.length > 1) {
              laneletGroup.add(makeRoadRibbon(L.centerline, laneHalfWidth(L)));
            }
          }

          for (const L of data.lanelets) {
            if (L.left.length  > 1) laneletGroup.add(makeLaneLine(L.left,  0xffffff));
            if (L.right.length > 1) laneletGroup.add(makeLaneLine(L.right, 0xffffff));
            if (L.centerline.length > 1) laneletGroup.add(makeLaneLine(L.centerline, 0x888888, true));
          }
        }
      };

      animate();

      // keep it sized to the window
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
