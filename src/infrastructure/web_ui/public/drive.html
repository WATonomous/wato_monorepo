<!DOCTYPE html>
<html>
  <head>
    <title>EVE Drive View</title>
    <style>
      * { margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; background: #0a0a0f; }
      #drive { display: block; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <canvas id="drive"></canvas>

    <script type="module">
      import * as THREE from '/lib/three.module.js';

      const canvas = document.getElementById('drive');

      // renderer — draws the scene onto the canvas
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);

      // scene — the 3D world
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0a0f);

      // camera — perspective, positioned behind & above the car looking forward
      const camera = new THREE.PerspectiveCamera(
        60,                                   // field of view
        window.innerWidth / window.innerHeight, // aspect ratio
        0.1, 1000                             // near / far clip
      );
      camera.position.set(0, 6, -12);   // behind (−z) and above (+y) the car
      camera.lookAt(0, 0, 10);          // look forward (+z)

      // light — so surfaces aren't flat black
      const ambient = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambient);
      const dir = new THREE.DirectionalLight(0xffffff, 0.8);
      dir.position.set(5, 10, 5);
      scene.add(dir);

      // ground plane
      const groundGeo = new THREE.PlaneGeometry(200, 200);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1a22 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;   // lay it flat (default plane is vertical)
      scene.add(ground);

      // grid overlay so motion/scale is visible
      const grid = new THREE.GridHelper(200, 40, 0x333344, 0x222230);
      scene.add(grid);

      // the ego car — a simple box for now
      const carGeo = new THREE.BoxGeometry(2, 1, 4);   // width, height, length
      const carMat = new THREE.MeshStandardMaterial({ color: 0x4da3ff });
      const car = new THREE.Mesh(carGeo, carMat);
      car.position.set(0, 0.5, 0);   // sit on the ground (half its height up)
      scene.add(car);

      // render loop — runs ~60x/sec
      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
      animate();

      // keep it sized to the window
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
