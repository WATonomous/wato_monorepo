---
# Per-lidar params for template_lidar_pipeline.yaml, keyed by node name.
# Transform values follow velodyne_pointcloud's config/<model>-velodyne_transform_node-params.yaml;
# the calibration file is passed by all_lidars_composed.yaml.
velodyne_driver_node_lidar_cc:
  ros__parameters:
    device_ip: 10.8.0.91
    gps_time: false
    time_offset: 0.0
    enabled: true
    read_once: false
    read_fast: false
    repeat_delay: 0.0
    frame_id: lidar_cc
    model: VLS128
    rpm: 600.0
    port: 2371
    timestamp_first_packet: false

velodyne_transform_node_lidar_cc:
  ros__parameters:
    model: VLS128
    min_range: 0.4
    max_range: 300.0
    organize_cloud: true

# lidar_ne: VLP-16
velodyne_driver_node_lidar_ne:
  ros__parameters:
