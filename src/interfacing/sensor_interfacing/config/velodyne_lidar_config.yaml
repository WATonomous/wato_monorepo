    gps_time: false
    time_offset: 0.0
    enabled: true
    read_once: false
    read_fast: false
    repeat_delay: 0.0
    frame_id: lidar_ne
    model: VLP16
    rpm: 1200.0
    port: 2369
    timestamp_first_packet: false

velodyne_transform_node_lidar_ne:
  ros__parameters:
    model: VLP16
    min_range: 0.9
    max_range: 130.0
    organize_cloud: true

