---
# Simulation-specific action configuration
# Uses CARLA odometry directly, tuned for simulation dynamics

# =============================================================================
# Lattice Planner (simulation)
# =============================================================================
/**/lattice_planning_node:
  ros__parameters:
    lanelet_ahead_topic: "lanelet_ahead"
    odom_topic: "odom"
    bt_topic: "execute_behaviour"
    path_topic: "path"
    available_paths_topic: "available_paths"
    control_rate_hz: 2.0

    num_lane_switch_horizons: 3
    lane_switch_lookahead_distances: [10.0, 17.5, 25.0]

    centreline_horizon: 35.0
    centreline_velocity_scale: 0.2

    cost_function:
      lateral_movement_weight: 2.0
      physical_limits_weight: 4.0
      preferred_lane_cost: 100.0
      unknown_occupancy_cost: 50.0
      max_curvature_change: 0.1

    path_gen:
      max_iterations: 20
      path_steps: 35
      convergence_tolerance: 0.15
      newton_damping: 0.7
      max_step_size: 1.0

    spiral_coeffs:
      c1_k0_coeff: -11.0
      c1_k1_coeff: 18.0
      c1_k2_coeff: -9.0
      c1_k3_coeff: 2.0
      c1_divisor: 2.0
      c2_k0_coeff: 18.0
      c2_k1_coeff: -45.0
      c2_k2_coeff: 36.0
      c2_k3_coeff: -9.0
      c2_divisor: 2.0
      c3_k0_coeff: -9.0
      c3_k1_coeff: 27.0
      c3_k2_coeff: -27.0
      c3_k3_coeff: 9.0
      c3_divisor: 2.0

# =============================================================================
# Trajectory Planner (simulation)
# =============================================================================
/**/trajectory_planner_node:
  ros__parameters:
    traj_pub_topic: "trajectory"
    marker_pub_topic: "trajectory_markers"
    path_sub_topic: "input_path"
    costmap_sub_topic: "costmap"
    lane_context_sub_topic: "lane_context"
    odom_sub_topic: "odom"
    bt_sub_topic: "execute_behaviour"

    stop_distance: 0.3
    max_speed: 10.0
    max_tangential_accel: 2.2
    max_emergency_accel: 5.0
    max_lateral_accel: 1.0
    interpolation_resolution: 0.1

    footprint_frame: "base_link"
    footprint_x_min: -0.5
    footprint_y_min: -1.2
    footprint_x_max: 3.5
    footprint_y_max: 1.2

# =============================================================================
# Lattice Planning Markers
# =============================================================================
/**/lattice_planning_markers_node:
  ros__parameters:
    path_topic: "path"
    available_paths_topic: "available_paths"
    path_markers_topic: "path_markers"
    available_paths_markers_topic: "available_paths_markers"
    path_line_width: 0.1
    available_path_line_width: 0.1
    available_paths_alpha: 1.0
    max_available_paths: 50
    publish_deleteall_each_update: true

# =============================================================================
# Pure Pursuit Controller
# =============================================================================
# CARLA-specific overrides vs ackermann_pure_pursuit/config/params.yaml
/**/pure_pursuit_node:
  ros__parameters:
    # Topics (relative names; the launch remaps them to CARLA sources)
    trajectory_topic: "trajectory"
    bt_topic: "execute_behaviour"
    ackermann_topic: "ackermann"
    idle_topic: "is_idle"
    controller_status_topic: "controller_status"
    odom_topic: "odom"

    # Frames (published by eve_description tf_publish in the sim bringup)
    base_frame: "base_footprint"
    rear_axle_frame: "rear_axle"
    front_axle_frame: "front_axle"

    # --- Adaptive lookahead ---
    lookahead_distance: 5.0           # maximum lookahead (m)
    min_lookahead_distance: 2.0       # minimum lookahead (m)
    lookahead_time: 1.5               # time-headway: ld = lookahead_time * speed (s)
    curvature_lookahead_gain: 2.0     # shrink ld in curves: ld_eff = ld / (1 + gain*|kappa|)
    curvature_est_arc: 1.5            # half-window arc length for curvature estimation (m)
    speed_lookahead_distance: 1.0     # minimum distance ahead used to sample target speed (m)
    speed_lookahead_time: 2.0         # time-headway for the speed sample horizon (s)

    # --- Steering ---
    steering_angle_gain: 1.0
    max_steering_angle: 0.5           # rad
    max_steering_rate: 1.0            # rad/s

    # --- Speed ---
    max_speed: 8.0                    # m/s
    min_speed: 0.0                    # m/s
    max_lateral_accel: 2.5            # m/s^2, cornering-speed budget
    max_accel: 1.5                    # m/s^2, command slew up
    max_decel: 3.0                    # m/s^2, command slew down

    # --- Low-speed cross-track blend (Stanley) ---
    enable_stanley_blend: false
    stanley_gain: 0.5
    stanley_softening: 1.0
    stanley_speed_threshold: 2.0      # blend fades out above this speed (m/s)

    # --- Disengage monitor (advisory only) ---
    enable_disengage: false
    max_cross_track_error: 1.5        # m
    max_heading_error: 0.6            # rad
    disengage_debounce_sec: 0.5
    disengage_latch: false
    disengage_speed: 0.0

    # --- Standby / misc ---
    standby_speed: 0.0
    standby_steering: 0.0
    control_rate_hz: 20.0
    wheelbase_fallback: 2.5667
    idle_timeout_sec: 2.0
    # Emit ROS left-positive steering; carla_control converts to CARLA's sign.
    invert_steering: false
    disable_standby: true
