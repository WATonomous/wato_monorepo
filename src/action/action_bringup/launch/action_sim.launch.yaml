# Simulation action stack. The simulation owns the environment, not this launch.
# TODO: replace the temporary enable_planning switch with separate planning and
# control launch files when the action stack is split.
launch:
  - arg:
      name: enable_planning
      default: "true"
      description: Disable for fake planner trajectory injection
  - arg:
      name: use_sim_time
      default: "true"
  - arg:
      name: autostart
      default: "true"
  - arg:
      name: bond_enabled
      default: "false"
  - node:
      if: $(var enable_planning)
      pkg: lattice_planning
      exec: lattice_planning_node
      name: lattice_planning_node
      namespace: action/lattice_planning
      output: screen
      param:
        - from: $(find-pkg-share action_bringup)/config/action_sim.yaml
        - name: use_sim_time
          value: $(var use_sim_time)
      remap:
        - {from: lanelet_ahead, to: /world_modeling/lanelet/lanelet_ahead}
        - {from: odom, to: /ego/odom}
        - {from: execute_behaviour, to: /behaviour/execute_behaviour}
  - node:
      if: $(var enable_planning)
      pkg: trajectory_planner
      exec: trajectory_planner_node
      name: trajectory_planner_node
      namespace: action/trajectory_planning
      output: screen
      param:
        - from: $(find-pkg-share action_bringup)/config/action_sim.yaml
        - name: use_sim_time
          value: $(var use_sim_time)
      remap:
        - {from: input_path, to: /action/lattice_planning/path}
        - {from: costmap, to: /world_modeling/costmap}
        - {from: trajectory, to: /action/trajectory_planning/trajectory}
        - {from: lane_context, to: /world_modeling/lanelet/lane_context}
        - {from: odom, to: /ego/odom}
        - {from: execute_behaviour, to: /behaviour/execute_behaviour}
  - node:
      if: $(var enable_planning)
      pkg: lattice_planning_markers
      exec: lattice_planning_markers_node
      name: lattice_planning_markers_node
      namespace: action/lattice_planning_markers
      output: screen
      param:
        - from: $(find-pkg-share action_bringup)/config/action_sim.yaml
        - name: use_sim_time
          value: $(var use_sim_time)
      remap:
        - {from: path, to: /action/lattice_planning/path}
        - {from: available_paths, to: /action/lattice_planning/available_paths}
  - node:
      pkg: ackermann_pure_pursuit
      exec: pure_pursuit_node
      name: pure_pursuit_node
      namespace: action
      output: screen
      param:
        - from: $(find-pkg-share action_bringup)/config/action_sim.yaml
        - name: use_sim_time
          value: $(var use_sim_time)
      remap:
        - {from: trajectory, to: /action/trajectory_planning/trajectory}
        - {from: execute_behaviour, to: /behaviour/execute_behaviour}
        - {from: odom, to: /ego/odom}
        - {from: ackermann, to: /carla/ackermann_control/command}
  - node:
      if: $(var enable_planning)
      pkg: wato_lifecycle_manager
      exec: wato_lifecycle_manager_node
      name: action_lifecycle_manager
      namespace: action
      param:
        - name: node_names
          value:
            - /action/lattice_planning/lattice_planning_node
            - /action/trajectory_planning/trajectory_planner_node
            - /action/pure_pursuit_node
        - {name: autostart, value: $(var autostart)}
        - {name: transition_timeout_s, value: 10.0}
        - {name: bond_enabled, value: $(var bond_enabled)}
  - node:
      unless: $(var enable_planning)
      pkg: wato_lifecycle_manager
      exec: wato_lifecycle_manager_node
      name: action_lifecycle_manager
      namespace: action
      param:
        - name: node_names
          value: [/action/pure_pursuit_node]
        - {name: autostart, value: $(var autostart)}
        - {name: transition_timeout_s, value: 10.0}
        - {name: bond_enabled, value: $(var bond_enabled)}
