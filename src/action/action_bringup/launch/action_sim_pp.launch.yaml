# Keep the existing pure-pursuit simulation entrypoint on the canonical stack.
# Its planners, controller, remaps and lifecycle ownership are defined once.
---
launch:
  - arg:
      name: autostart
      default: "true"
      description: Automatically configure and activate managed nodes

  - arg:
      name: bond_enabled
      default: "false"
      description: Enable bond-based crash detection

  - arg:
      name: use_sim_time
      default: "true"
      description: Use the CARLA clock for planning and control

  - arg:
      name: stop_distance
      default: "0.3"
      description: Clearance before the predicted footprint collision point in metres

  - arg:
      name: max_speed
      default: "10.0"
      description: Maximum planned and controlled speed in metres per second

  - arg:
      name: command_topic
      default: "/carla/ackermann_control/command"
      description: Controller output topic

  - include:
      file: "$(find-pkg-share action_bringup)/launch/action_sim.launch.yaml"
      arg:
        - name: autostart
          value: "$(var autostart)"
        - name: bond_enabled
          value: "$(var bond_enabled)"
        - name: use_sim_time
          value: "$(var use_sim_time)"
        - name: stop_distance
          value: "$(var stop_distance)"
        - name: max_speed
          value: "$(var max_speed)"
        - name: command_topic
          value: "$(var command_topic)"
