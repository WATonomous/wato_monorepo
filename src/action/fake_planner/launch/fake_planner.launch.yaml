# fake_planner.launch.yaml
#
# Environment-agnostic controller test rig. Brings up:
#   - fake_planner_node  : replays a predefined maneuver (from a maneuver JSON segment list) + an
#                          execute_behaviour heartbeat
#   - pure_pursuit_node  : the ackermann_pure_pursuit controller under test
#   - lifecycle manager  : configures + activates both
#
# The only difference between sim and the real car is the odom source and where the command
# goes, both exposed as launch args:
#
#   CARLA sim (defaults):
#     ros2 launch fake_planner fake_planner.launch.yaml
#
#   Real vehicle:
#     ros2 launch fake_planner fake_planner.launch.yaml \
#         odom_topic:=/world_modeling/transform/odometry \
#         ackermann_topic:=/action/ackermann
#
# Pick a maneuver with maneuver_file:=... (or add a new .json under maneuvers/).

launch:
  - arg:
      name: odom_topic
      default: "/ego/odom"
      description: Odometry source (controller speed + trajectory anchoring)

  - arg:
      name: ackermann_topic
      default: "/carla/ackermann_control/command"
      description: Where the controller publishes AckermannDriveStamped commands

  - arg:
      name: frame_id
      default: "odom"
      description: Frame the trajectory is published in (must be TF-connected to rear_axle)

  - arg:
      name: maneuver_file
      default: "$(find-pkg-share fake_planner)/maneuvers/steady_state_slalom.json"
      description: Maneuver JSON to replay (one maneuver per file; a segment list)

  - arg:
      name: autostart
      default: "true"
      description: Automatically configure and activate managed nodes

  - arg:
      name: use_sim_time
      default: "false"
      description: >-
        Use /clock. Required in CARLA: the bridge stamps odom/TF with sim time, and a
        wall-clock trajectory stamp cannot be transformed against a sim-time TF tree --
        pure pursuit then aborts every cycle and never publishes a command.

  - arg:
      name: standby_speed
      default: "-0.5"
      description: >-
        Speed the controller commands while in standby. The package default (-0.5) is a
        reverse creep, which walks the car backwards off the road if it is held in standby
        for any length of time -- set 0.0 to actually hold still.

  - arg:
      name: start_on_activate
      default: "true"
      description: >-
        Publish as soon as the node activates. Set false to bring the stack up with the
        vehicle held in standby, then release it with the start_trajectory service.

  - arg:
      name: anchor_to_first_pose
      default: "true"
      description: >-
        Lay the maneuver out from the vehicle's pose at launch. Set false for maneuvers
        authored in absolute frame_id coordinates (those supplying a "start" pose).

  # Fake Planner
  - node:
      pkg: "fake_planner"
      exec: "fake_planner_node"
      name: "fake_planner_node"
      namespace: "action/fake_planner"
      output: "screen"
      param:
        - from: "$(find-pkg-share fake_planner)/config/params.yaml"
        - name: "maneuver_file"
          value: "$(var maneuver_file)"
        - name: "frame_id"
          value: "$(var frame_id)"
        - name: "anchor_to_first_pose"
          value: "$(var anchor_to_first_pose)"
        - name: "start_on_activate"
          value: "$(var start_on_activate)"
        - name: "use_sim_time"
          value: "$(var use_sim_time)"
      remap:
        - from: "trajectory"
          to: "/action/fake_planner/trajectory"
        - from: "execute_behaviour"
          to: "/action/fake_planner/execute_behaviour"
        - from: "odom"
          to: "$(var odom_topic)"

  # Pure Pursuit Controller (under test)
  - node:
      pkg: "ackermann_pure_pursuit"
      exec: "pure_pursuit_node"
      name: "pure_pursuit_node"
      namespace: "action"
      output: "screen"
      param:
        - from: "$(find-pkg-share ackermann_pure_pursuit)/config/params.yaml"
        - name: "standby_speed"
          value: "$(var standby_speed)"
        - name: "use_sim_time"
          value: "$(var use_sim_time)"
      remap:
        # Subscribers
        - from: "trajectory"
          to: "/action/fake_planner/trajectory"
        - from: "execute_behaviour"
          to: "/action/fake_planner/execute_behaviour"
        - from: "odom"
          to: "$(var odom_topic)"
        # Publishers
        - from: "ackermann"
          to: "$(var ackermann_topic)"

  # Lifecycle Manager
  - node:
      pkg: "wato_lifecycle_manager"
      exec: "wato_lifecycle_manager_node"
      name: "fake_planner_lifecycle_manager"
      namespace: "action"
      param:
        - name: "node_names"
          value:
            - /action/fake_planner/fake_planner_node
            - /action/pure_pursuit_node
        - name: autostart
          value: $(var autostart)
        - name: transition_timeout_s
          value: 10.0
        - name: bond_timeout_s
          value: 4.0
        - name: bond_enabled
          value: false
