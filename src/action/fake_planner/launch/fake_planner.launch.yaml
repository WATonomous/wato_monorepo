# fake_planner.launch.yaml
#
# Environment-agnostic controller test rig. Brings up:
#   - fake_planner_node  : replays a predefined maneuver (from a maneuver JSON segment list) + an
#                          execute_behaviour heartbeat, and publishes trajectory_markers
#                          (the same MarkerArray visualization as the real trajectory_planner)
#   - the controller under test (selected via controller:=, see launch/controllers/)
#   - lifecycle manager  : configures + activates both
#
# The only difference between sim and the real car is the odom source and where the command
# goes, both exposed as launch args:
#
#   CARLA sim (defaults):
#     ros2 launch fake_planner fake_planner.launch.yaml
#
#   Real vehicle:
#     ros2 launch fake_planner fake_planner.launch.yaml \
#         odom_topic:=/world_modeling/transform/odometry \
#         ackermann_topic:=/action/ackermann
#
# Pick the controller with controller:=pure_pursuit|mpc and the maneuver with
# maneuver:=<name> (a .json under maneuvers/, e.g. maneuver:=brake_in_curve), or point
# maneuver_file:= at any JSON path directly.

launch:
  - arg:
      name: odom_topic
      default: "/ego/odom"
      description: Odometry source (controller speed + trajectory anchoring)

  - arg:
      name: ackermann_topic
      default: "/carla/ackermann_control/command"
      description: Where the controller publishes AckermannDriveStamped commands

  - arg:
      name: frame_id
      default: "odom"
      description: Frame the trajectory is published in (must be TF-connected to rear_axle)

  - arg:
      name: controller
      default: "pure_pursuit"
      description: "Controller under test: pure_pursuit or mpc (picks launch/controllers/<controller>.launch.yaml)"

  - arg:
      name: maneuver
      default: "steady_state_slalom"
      description: Maneuver to replay, by name under the package's maneuvers/ folder (without .json)

  - arg:
      name: maneuver_file
      default: "$(find-pkg-share fake_planner)/maneuvers/$(var maneuver).json"
      description: Full path to the maneuver JSON; overrides `maneuver` when set explicitly

  - arg:
      name: autostart
      default: "true"
      description: Automatically configure and activate managed nodes

  - arg:
      name: use_sim_time
      default: "false"
      description: Use /clock. Required in CARLA, else the controller can't transform the trajectory.

  - arg:
      name: standby_speed
      default: "-0.5"
      description: Controller speed in standby. Package default -0.5 reverses; use 0.0 to hold still.

  - arg:
      name: start_on_activate
      default: "true"
      description: Publish on activate. Set false to hold until the start_trajectory service.

  - arg:
      name: anchor_to_first_pose
      default: "true"
      description: Lay the maneuver from the launch pose. Set false for absolute maneuvers (with a "start" pose).

  # Fake Planner
  - node:
      pkg: "fake_planner"
      exec: "fake_planner_node"
      name: "fake_planner_node"
      namespace: "action/fake_planner"
      output: "screen"
      param:
        - from: "$(find-pkg-share fake_planner)/config/params.yaml"
        - name: "maneuver_file"
          value: "$(var maneuver_file)"
        - name: "frame_id"
          value: "$(var frame_id)"
        - name: "anchor_to_first_pose"
          value: "$(var anchor_to_first_pose)"
        - name: "start_on_activate"
          value: "$(var start_on_activate)"
        - name: "use_sim_time"
          value: "$(var use_sim_time)"
      remap:
        - from: "trajectory"
          to: "/action/fake_planner/trajectory"
        - from: "execute_behaviour"
          to: "/action/fake_planner/execute_behaviour"
        - from: "odom"
          to: "$(var odom_topic)"

  # Controller under test + the lifecycle manager that drives both nodes.
  - include:
      file: "$(find-pkg-share fake_planner)/launch/controllers/$(var controller).launch.yaml"
      arg:
        - name: odom_topic
          value: $(var odom_topic)
        - name: ackermann_topic
          value: $(var ackermann_topic)
        - name: standby_speed
          value: $(var standby_speed)
        - name: use_sim_time
          value: $(var use_sim_time)
        - name: autostart
          value: $(var autostart)
