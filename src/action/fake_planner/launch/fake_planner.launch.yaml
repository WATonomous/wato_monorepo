# fake_planner.launch.yaml
#
# The controller test rig, shared by every environment and controller. Brings up the
# fake_planner_node (maneuver replay + execute_behaviour heartbeat + trajectory_markers), the
# controller under test (pure pursuit or MPC, via controller:=), and a lifecycle manager for both.
#
# Prefer launching one of the environment wrappers beside it, which pin every topic/clock/safety
# arg explicitly and forward everything below:
#     fake_planner_sim.launch.yaml       CARLA
#     fake_planner_vehicle.launch.yaml   the real car
#
# Nothing drives on bringup: start_on_activate is false, so the rig comes up activated but silent
# with the controller in standby. Markers publish while held, so the path can be inspected first.
#
#   ros2 launch fake_planner fake_planner_sim.launch.yaml
#   ros2 service call /action/fake_planner/fake_planner_node/start_trajectory std_srvs/srv/Trigger
#   ros2 launch fake_planner fake_planner_sim.launch.yaml maneuver:=brake_in_curve controller:=mpc
#
# maneuver:=oval_track needs the oval scenario loaded in CARLA (scenario:= on the simulation
# launch). See README.md for the full set of recipes and the /stop_trajectory + /reset services.

launch:
  - arg:
      name: odom_topic
      default: "/ego/odom"
      description: Odometry source (controller speed + trajectory anchoring)

  - arg:
      name: ackermann_topic
      default: "/carla/ackermann_control/command"
      description: Where the controller publishes AckermannDriveStamped commands

  - arg:
      name: trajectory_topic
      default: "/action/fake_planner/trajectory"
      description: Trajectory topic, from the fake planner to the controller

  - arg:
      name: behaviour_topic
      default: "/action/fake_planner/execute_behaviour"
      description: Behaviour heartbeat topic, from the fake planner to the controller

  - arg:
      name: frame_id
      default: "odom"
      description: Frame the trajectory is published in (must be TF-connected to rear_axle)

  # -- What to run
  - arg:
      name: controller
      default: "pure_pursuit"
      description: "Controller under test: pure_pursuit or mpc"

  # Pure pursuit's tuning differs a lot between the two files (lookahead 5 m vs 30 m, gain 0.5 vs
  # 2.0), so which is loaded decides what the run measures. The package's own params are the
  # CARLA-tuned set; the vehicle launch swaps in action.yaml. MPC reads action.yaml in both.
  - arg:
      name: pure_pursuit_config
      default: "$(find-pkg-share ackermann_pure_pursuit)/config/params.yaml"
      description: Pure pursuit parameter file. The vehicle launch overrides this with action_bringup's action.yaml.

  - arg:
      name: maneuver
      default: "steady_state_slalom"
      description: Maneuver to replay, by name under the package's maneuvers/ folder (without .json)

  - arg:
      name: maneuver_file
      default: "$(find-pkg-share fake_planner)/maneuvers/$(var maneuver).json"
      description: Full path to the maneuver JSON; overrides `maneuver` when set explicitly

  # -- Behaviour knobs
  - arg:
      name: use_sim_time
      default: "true"
      description: Use /clock. Required in CARLA, else the controller can't transform the trajectory. Set false on the real car.

  - arg:
      name: autostart
      default: "true"
      description: Automatically configure and activate managed nodes

  - arg:
      name: start_on_activate
      default: "false"
      description: Hold in standby until the start_trajectory service is called. True publishes on activate.

  - arg:
      name: anchoring
      default: "auto"
      description: auto|relative|absolute. auto lays relative maneuvers from the launch pose and publishes absolute ones (those with a "start", e.g. oval_track) where they were drawn.

  - arg:
      name: standby_speed
      default: "0.0"
      description: Controller speed in standby. 0.0 holds still; the controllers' own -0.5 default reverses.

  # Makes "respawn ego" a one-click reset in sim. On the real car a jump this size is a
  # localization correction to keep driving through, so the vehicle launch sets 0.
  - arg:
      name: respawn_jump_m
      default: "5.0"
      description: Odom jump (m) treated as a respawn, after which the maneuver re-anchors. 0 disables.

  # -- Lifecycle manager tuning. Defaults are what the rig has always used; exposed so a slow
  # machine can be given more time without editing the launch.
  - arg:
      name: transition_timeout_s
      default: "10.0"
      description: How long the lifecycle manager waits for each configure/activate transition

  - arg:
      name: bond_timeout_s
      default: "4.0"
      description: Bond heartbeat timeout, used only when bond_enabled is true

  # Off by default: bonding tears the rig down when a managed node stops heartbeating, and for a
  # test rig a controller that has crashed is more useful left in place for inspection.
  - arg:
      name: bond_enabled
      default: "false"
      description: Enable bond-based crash detection for the managed nodes

  # Everything controller-specific keys off this one flag, so the node that runs and the node the
  # lifecycle manager waits for can't drift apart.
  - let:
      name: is_mpc
      value: "$(equals $(var controller) mpc)"

  # Fake Planner
  - node:
      pkg: "fake_planner"
      exec: "fake_planner_node"
      name: "fake_planner_node"
      namespace: "action/fake_planner"
      output: "screen"
      param:
        - from: "$(find-pkg-share fake_planner)/config/params.yaml"
        - name: "maneuver_file"
          value: "$(var maneuver_file)"
        - name: "frame_id"
          value: "$(var frame_id)"
        - name: "anchoring"
          value: "$(var anchoring)"
        - name: "start_on_activate"
          value: "$(var start_on_activate)"
        - name: "respawn_jump_m"
          value: "$(var respawn_jump_m)"
        - name: "use_sim_time"
          value: "$(var use_sim_time)"
      remap:
        - from: "trajectory"
          to: "$(var trajectory_topic)"
        - from: "execute_behaviour"
          to: "$(var behaviour_topic)"
        - from: "odom"
          to: "$(var odom_topic)"

  # Pure Pursuit Controller (under test, default)
  - node:
      unless: "$(var is_mpc)"
      pkg: "ackermann_pure_pursuit"
      exec: "pure_pursuit_node"
      name: "pure_pursuit_node"
      namespace: "action"
      output: "screen"
      param:
        - from: "$(var pure_pursuit_config)"
        - name: "standby_speed"
          value: "$(var standby_speed)"
        - name: "use_sim_time"
          value: "$(var use_sim_time)"
      remap:
        - from: "trajectory"
          to: "$(var trajectory_topic)"
        - from: "execute_behaviour"
          to: "$(var behaviour_topic)"
        - from: "odom"
          to: "$(var odom_topic)"
        - from: "ackermann"
          to: "$(var ackermann_topic)"

  # MPC Controller (under test, controller:=mpc)
  - node:
      if: "$(var is_mpc)"
      pkg: "mpc_controller"
      exec: "mpc_controller_node"
      name: "mpc_controller_node"
      namespace: "action"
      output: "screen"
      param:
        - from: "$(find-pkg-share action_bringup)/config/action.yaml"
        - name: "standby_speed"
          value: "$(var standby_speed)"
        - name: "use_sim_time"
          value: "$(var use_sim_time)"
      remap:
        - from: "trajectory"
          to: "$(var trajectory_topic)"
        - from: "execute_behaviour"
          to: "$(var behaviour_topic)"
        - from: "odom"
          to: "$(var odom_topic)"
        - from: "ackermann"
          to: "$(var ackermann_topic)"
        - from: "predicted_path"
          to: "/action/mpc/predicted_path"

  # Lifecycle Manager. Names the controller explicitly, so it follows controller:=.
  - node:
      pkg: "wato_lifecycle_manager"
      exec: "wato_lifecycle_manager_node"
      name: "fake_planner_lifecycle_manager"
      namespace: "action"
      param:
        - name: "node_names"
          value:
            - "/action/fake_planner/fake_planner_node"
            - "$(if $(var is_mpc) /action/mpc_controller_node /action/pure_pursuit_node)"
        - name: autostart
          value: $(var autostart)
        - name: transition_timeout_s
          value: $(var transition_timeout_s)
        - name: bond_timeout_s
          value: $(var bond_timeout_s)
        - name: bond_enabled
          value: $(var bond_enabled)
