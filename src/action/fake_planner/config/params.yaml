/**/fake_planner_node:
  ros__parameters:
    # Topic names (before launch remaps). Keep these matching the controller's inputs.
    trajectory_topic: "trajectory"
    behaviour_topic: "execute_behaviour"
    odom_topic: "odom"

    # Frame the trajectory is published in. Must be TF-connected to the controller's
    # rear_axle frame (map/odom both work in the standard stack).
    frame_id: "odom"

    # Republish rate. Must stay well under the controller's idle_timeout_sec (2.0 s).
    publish_rate_hz: 10.0

    # Publish a non-"standby" execute_behaviour heartbeat so the controller engages without
    # the world_modeling behaviour stack. Set false to use a real behaviour source instead.
    publish_behaviour: true
    behaviour: "lane_follow"

    # Whether the waypoints are laid out from the vehicle's pose at launch (captured from the first
    # odom) or published in the file's own coordinates. "auto" takes that from the maneuver, the way
    # "closed" decides looping: a file carrying an absolute "start" is drawn on fixed geometry and
    # publishes verbatim, everything else is vehicle-relative and starts at the car wherever it is.
    # "relative"/"absolute" force it -- only useful to replay an absolute shape away from its own
    # track. (Not "on"/"off": YAML reads those as booleans and the node aborts on the type clash.)
    anchoring: "auto"

    horizon_m: 35.0
    trail_m: 2.0

    # Pose jump (m between consecutive odom messages) that counts as a respawn rather than
    # driving, after which the node re-anchors the maneuver at the new pose on its own. This is
    # what makes "respawn ego" a one-click reset in Foxglove. Set 0 to disable.
    respawn_jump_m: 5.0

    # When an open maneuver counts as finished: the vehicle is within finish_distance_m of the
    # stop line (measured along the path) and moving no faster than finish_speed_mps.
    finish_distance_m: 3.0
    finish_speed_mps: 0.25
