trajectory_planner_node:
  ros__parameters:

    # Publsiher Topic Names
    traj_pub_topic: "trajectory"
    marker_pub_topic: "trajectory_markers"

    # Subscriber Topic Names
    path_sub_topic: "input_path"
    costmap_sub_topic: "costmap"
    lane_context_sub_topic: "lane_context"
    odom_sub_topic: "odom"
    bt_sub_topic: "execute_behaviour"

    # Safety distances
    stop_distance: 2.0   # Distance (m) where vehicle must be fully stopped (relative to front bumper)

    # Speed limits
    max_speed: 20.0  # Default maximum speed (m/s) if lanelet limit unavailable
    max_tangential_accel: 1.0  # Max tangential acceleration (m/s^2) for comfort
    max_emergency_accel: 5.0  # Max emergency braking deceleration (m/s^2) for obstacle avoidance
    max_lateral_accel: 0.5 # Max lateral acceleration (m/s^2) to slow down in curves

    # Path interpolation
    interpolation_resolution: 0.1  # Resolution (m) for path interpolation

    # Vehicle footprint bounding box in footprint_frame (m)
    # x: forward/backward, y: left/right (ROS convention)
    footprint_frame: "base_link"
    footprint_x_min: -0.5    # rear of vehicle
    footprint_y_min: -1.2    # right side
    footprint_x_max: 3.5     # front bumper
    footprint_y_max: 1.2     # left side

    # Deterministic costmap-only lateral obstacle avoidance. If the entire maneuver cannot be
    # validated, the resampled centerline is retained and normal braking handles the obstacle.
    elastic_band_enabled: true
    eb_max_deviation: 0.8          # maximum lateral shift from the input centerline (m)
    eb_lateral_search_step: 0.1    # lateral offset search increment (m)
    eb_clearance_margin: 0.3       # extra lateral footprint clearance during validation (m)
    eb_transition_distance: 5.0    # smoothstep ramp distance before and after a cluster (m)
    eb_preferred_side: "left"      # deterministic tie-break: "left" or "right"
